  // nel browser: la foto si scarica, con data e ora nel nome
  function scaricaFoto() {
    var d = new Date(), p = function (v) { return (v < 10 ? '0' : '') + v; };
    var nome = 'ascii-zoo-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' +
      p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.png';
    var c = fotoCanvas();
    var scarica = function (url) {
      var a = document.createElement('a');
      a.href = url;
      a.download = nome;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
    // un Blob, non un data URL: quelli grandi alcuni browser non li scaricano
    if (c.toBlob) {
      c.toBlob(function (blob) {
        if (!blob) return;
        var url = URL.createObjectURL(blob);
        scarica(url);
        setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      }, 'image/png');
    } else scarica(c.toDataURL('image/png'));
  }
  // dentro il programma lo sfondo non riceve tasti; la foto la salva lui
  var nelProgramma = location.protocol === 'zoo:' || location.hostname === 'zoo.localhost';
  if (!nelProgramma) {
    document.addEventListener('keydown', function (e) {
      var tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'p' || e.key === 'P') scaricaFoto();
    });
  }

  /* Orologio al centro: lo spegne il programma con zooSetting('orologio', false), nel
     browser index.html?orologio=0 e in Lively la casella "Orologio al centro"
     (LivelyProperties.json; Lively chiama livelyPropertyListener). */
  var qo = /[?&]orologio=([^&#]*)/.exec(location.search);
  if (qo) zoo.setClock(!/^(0|no|off|false)$/i.test(qo[1]));
  // la neve delle feste: index.html?neve=0 la spegne, ?neve=sempre la fa cadere anche fuori stagione
  var qn = /[?&]neve=([^&#]*)/.exec(location.search);
  if (qn) zoo.neveOpz = /^sempre$/i.test(qn[1]) ? 'sempre' : !/^(0|no|off|false)$/i.test(qn[1]);
  window.livelyPropertyListener = function (name, val) {
    if (name === 'orologio') zoo.setClock(val === true || val === 'true');
    if (name === 'neve') zoo.neveOpz = val === true || val === 'true';
    // le tendine di Lively passano la posizione della voce scelta
    if (name === 'tema') setTema(['scuro', 'chiaro', 'auto'][+val] || val);
  };
  if (/[?&]widget=demo/.test(location.search)) {
    var tra = new Date(Date.now() + 12 * 86400000), q = function (k) { var m = new RegExp('[?&]' + k + '=([\\w-]+)').exec(location.search); return m && m[1]; };
    impostaWidget({
      nota: 'comprare il mangime per KARPISA', conto: { etichetta: 'esame di analisi', data: tra.toISOString().slice(0, 10) }, statistiche: true,
      nerd: ['core', 'temperatura', 'frequenza', 'memoria', 'gpu', 'rete', 'disco', 'acceso', 'processi', 'carico'], musica: true,
      angolo: q('angolo'), dimensione: q('dimensione'), cornice: q('cornice'), sfondo: q('sfondo')
    });
    var finte = function (cpu) {
      var c = [3, 0, 41, 12, 88, 7, 0, 23].map(function (x) { return Math.min(100, Math.round(x * (0.6 + Math.random() * 0.8))); });
      return {
        cpu: cpu, ram: 55 + Math.random() * 5, batteria: 83, carica: true, core: c, temp: 52 + Math.random() * 6, freq: 3100 + Math.random() * 400,
        mem: [9.1 * 1073741824, 15.5 * 1073741824], swap: [0.2 * 1073741824, 2 * 1073741824],
        gpu: 17 + Math.random() * 25, vram: [2.3 * 1073741824, 8 * 1073741824], gputemp: 58 + Math.random() * 4, rete: [1.2 * 1048576 * Math.random(), 34000],
        disco: [212 * 1073741824, 476 * 1073741824], acceso: 3 * 86400 + 4 * 3600 + 720, processi: 312, carico: [0.52, 0.61, 0.7]
      };
    };
    setInterval(function () { impostaStats(finte(8 + Math.random() * 30)); }, 2000);
    impostaPomodoro({ fase: 'lavoro', fine: Date.now() + 23 * 60000 + 41000, durata: 25 * 60000, fatti: 1, ogni: 4, scatti: 0 });
    // &pomodoro=scatto: dopo 3 secondi finisce il lavoro e comincia la pausa (lampo e onda)
    if (q('pomodoro') === 'scatto') setTimeout(function () { impostaPomodoro({ fase: 'pausa', fine: Date.now() + 5 * 60000, durata: 5 * 60000, fatti: 2, ogni: 4, scatti: 1 }); }, 3000);
    if (q('pomodoro') === 'pausa') impostaPomodoro({ fase: 'lavoro', rimasto: 12 * 60000 + 5000, durata: 25 * 60000, fatti: 1, ogni: 4, scatti: 0 });
    impostaMusica({ titolo: 'Ninna nanna per carpe', artista: 'KARPISA e i Ninfei', stato: q('musica') === 'pausa' ? 'pausa' : 'play', pos: 83000, durata: 225000, quando: Date.now() });
    impostaStats(finte(18));
  }

  // nel programma: le impostazioni di questo schermo, messe prima della pagina
  // (shared::script_iniziale), valgono già dal primo fotogramma
  if (typeof window.ZOO_INIZIO === 'function') {
    try { window.ZOO_INIZIO(); } catch (e) { /* arrivano comunque a pagina caricata */ }
  }
  // il primo sfondo c'è già al primo fotogramma, senza la dissolvenza dei cambi
  zoo.subito();
  Zoo.TEMPI.start = Math.round(performance.now());
  zoo.start();
  window.asciiZoo = zoo;
  if (wallpaper) return;

  /* ---- saluto ---- */
  var greeting = $('greeting'), clock = $('clock');
  function tick() {
    var d = new Date(), h = d.getHours();
    var late = h < 5 || h >= 23;
    var g = late ? 'Ancora in piedi' : h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
    greeting.textContent = g + (state.name ? ', ' + state.name : '') + (late ? '?' : '');
    clock.textContent =
      d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '') +
      ' · ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  }
  tick();
  setInterval(tick, 15000);

  /* ---- ricerca ---- */
  var form = $('search'), input = $('q'), link = $('search-link');
  var framed = true;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }

  function go(url, label) {
    if (framed) {
      // dentro una pagina incorporata non si può navigare: si offre il link
      link.href = url;
      link.textContent = label + ' ↗';
      link.hidden = false;
      link.focus();
    } else {
      location.assign(url);
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) return;
    if (/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/i.test(q)) {
      go(/^https?:\/\//i.test(q) ? q : 'https://' + q, 'Apri ' + q);
      return;
    }
    var api = typeof browser !== 'undefined' && browser.search ? browser.search : null;
    if (api) {
      // nell'estensione: motore di ricerca predefinito di Firefox
      if (api.query) api.query({ text: q, disposition: 'CURRENT_TAB' });
      else api.search({ query: q });
      return;
    }
    go('https://duckduckgo.com/?q=' + encodeURIComponent(q), 'Cerca «' + q + '» su DuckDuckGo');
  });
  input.addEventListener('input', function () { link.hidden = true; });

  /* ---- impostazioni ---- */
  var ui = $('ui'), panel = $('panel'), gear = $('gear');
  var nameInput = $('name'), autoInput = $('auto');
  nameInput.value = state.name;
  autoInput.checked = state.auto;

  function closePanel() {
    if (!panel) return; // versione sfondo: nessun pannello
    panel.hidden = true;
    gear.setAttribute('aria-expanded', 'false');
  }
  function setBare(on) {
    ui.classList.toggle('bare', on);
    gear.setAttribute('aria-label', on ? "Mostra l'interfaccia" : 'Impostazioni');
    gear.title = on ? "Mostra l'interfaccia (H)" : 'Impostazioni';
    if (on) closePanel();
  }
  setBare(false);

  gear.addEventListener('click', function () {
    if (ui.classList.contains('bare')) { setBare(false); return; }
    panel.hidden = !panel.hidden;
    gear.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
    if (!panel.hidden) nameInput.focus();
  });
  nameInput.addEventListener('input', function () {
    state.name = nameInput.value.trim();
    save();
    tick();
  });
  autoInput.addEventListener('change', function () {
    state.auto = autoInput.checked;
    save();
  });
  $('hide').addEventListener('click', function () { setBare(true); });
  $('foto').addEventListener('click', function () { closePanel(); scaricaFoto(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closePanel();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      return;
    }
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key.length === 1 && e.key >= '1' && e.key <= '9' && +e.key <= SPECIES.length) {
      setMode(SPECIES[+e.key - 1].id);
    } else if (e.key === 'h' || e.key === 'H') {
      setBare(!ui.classList.contains('bare'));
    } else if (e.key === '/') {
      e.preventDefault();
      setBare(false);
      input.focus();
    }
  });
})();
</script>
</body>
