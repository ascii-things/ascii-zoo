[package]
name = "ascii-zoo"
version = "0.9.0"
edition = "2021"
description = "Sfondo animato ASCII Zoo per Windows, macOS e Linux (KARPISA inclusa)"
license = "MIT"

[dependencies]
wry = "0.53"
tray-icon = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# statistiche per nerd (core, frequenza, memoria, uptime, carico): solo le parti che servono
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
winreg = "0.55"
# lo screensaver (cartella dreams/): motore nativo, senza WebView
ascii-dreams = { path = "../dreams" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # widget "In riproduzione": i controlli multimediali di sistema (WinRT)
  "Media_Control",
]

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.34"
# la scelta della scena dello screensaver (screensaver.json, lo legge il modulo ASCII Zoo.saver)
ascii-dreams = { path = "../dreams" }
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2 = "0.6"
block2 = "0.6"
libc = "0.2"
# batteria (IOPowerSources): gli stessi crate che usa già sysinfo
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "ps"] }

# sysinfo, le parti che dipendono dal sistema: la rete su Windows e macOS (su Linux si
# legge da /sys, più leggero), la temperatura su macOS e Linux (su Windows la darebbe
# solo WMI, con i permessi di amministratore)
[target.'cfg(windows)'.dependencies.sysinfo]
version = "0.37.2"
default-features = false
features = ["network"]
[target.'cfg(target_os = "macos")'.dependencies.sysinfo]
version = "0.37.2"
default-features = false
features = ["component", "network"]
[target.'cfg(target_os = "linux")'.dependencies.sysinfo]
version = "0.37.2"
default-features = false
features = ["component"]

# Linux: tao e gtk sono gli stessi che usano già wry e tray-icon
[target.'cfg(target_os = "linux")'.dependencies]
tao = "0.34"
gtk = "0.18"
libc = "0.2"
# lo screensaver, che qui fa partire l'app quando non si usa il PC
ascii-dreams = { path = "../dreams" }
# l'ora del server X, per attivare la finestra dello screensaver (c'è già, la usa wry)
gdkx11 = "0.18"

# lo screensaver disegna ogni fotogramma in software: qui conta la velocità, non la grandezza
[profile.release.package.ascii-dreams]
opt-level = 3
[profile.release.package.fontdue]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
strip = true
