/* Due temi. Di serie scuro: gli animali sono luce su fondo nero. Chiaro (data-tema="chiaro"
   sulla radice): inchiostro su carta. I colori dei widget e dell'interfaccia stanno tutti qui.
   Layout: canvas a tutto schermo; sopra, selettore in alto, saluto e ricerca al centro. */
:root {
  --bg: #090a0f;
  --ink: #eceef5;
  --ink-dim: #9196a8;
  --ink-faint: #5d6274;
  --panel: rgba(19, 21, 29, 0.74);
  --panel-pieno: rgba(19, 21, 29, 0.94);
  --line: rgba(255, 255, 255, 0.09);
  --tinta: 255, 255, 255; /* pulsanti e caselle: questo colore, poco coprente */
  --grana: rgba(255, 255, 255, 0.06); /* i puntini del fondo, uno per cella */
  --accent: #5aa7ff;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cell: 11px;
  /* widget: fondo dei riquadri con "Sfondo pieno" */
  --widget-fondo: rgba(9, 10, 15, 0.84);
  --widget-ombra: rgba(0, 0, 0, 0.35);
  /* pomodoro: il riquadro lampeggia di questo colore quando cambia fase */
  --widget-lampo: #ffd166;
  color-scheme: dark;
}
:root[data-tema="chiaro"] {
  --bg: #f3eee4;
  --ink: #22212a;
  --ink-dim: #55515e;
  --ink-faint: #8e8992;
  --panel: rgba(252, 249, 243, 0.78);
  --panel-pieno: rgba(252, 249, 243, 0.96);
  --line: rgba(70, 50, 25, 0.14);
  --tinta: 70, 50, 25;
  --grana: rgba(90, 64, 30, 0.14);
  --widget-fondo: rgba(252, 249, 243, 0.9);
  --widget-ombra: rgba(70, 50, 25, 0.16);
  --widget-lampo: #b45f06;
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--grana) 0 0.6px, transparent 1.1px);
  background-size: var(--cell) var(--cell);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.4;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

canvas { position: fixed; top: 0; left: 0; display: block; }
/* il bagliore è già sfocato e saturato dal motore (vedi sfocaBagliore): un filtro blur()
   qui costerebbe molto dove la grafica non è accelerata. Il canvas è piccolo (una cella per
   pixel) e lo ingrandisce transform su un suo livello (will-change): il compositor lo stira
   sulla GPU. Grande quanto lo schermo, WebKitGTK lo ridipingeva tutto a ogni aggiornamento */
#glow { opacity: 0.55; pointer-events: none; will-change: transform; }
/* chiaro: la luce sulla carta non si vede; resta un alone colorato morbido, come acquerello */
[data-tema="chiaro"] #glow { opacity: 0.32; mix-blend-mode: multiply; }
#zoo { cursor: crosshair; touch-action: manipulation; }

.ui { position: fixed; inset: 0; pointer-events: none; transition: opacity 0.25s; }
.ui > * { pointer-events: auto; }

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* selettore degli animali */
.modes {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; padding: 4px;
  max-width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.modes button {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 12px; border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-dim);
  font-size: 12px; white-space: nowrap;
  transition: background-color 0.15s, color 0.15s;
}
.modes button::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--dot); box-shadow: 0 0 8px var(--dot);
}
.modes button:hover { color: var(--ink); }
.modes .sep { align-self: stretch; width: 1px; margin: 4px 3px; background: rgba(var(--tinta), 0.18); }
.modes button[aria-pressed="true"] { background: rgba(var(--tinta), 0.11); color: var(--ink); }

/* saluto e ricerca */
.center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -56%);
  width: min(540px, calc(100% - 32px));
  display: grid; gap: 14px; justify-items: center; text-align: center;
  pointer-events: none;
}
.center > form, .center > a { pointer-events: auto; }
.clock {
  margin: 0; color: var(--ink-dim); font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 10px var(--bg), 0 0 4px var(--bg);
}
h1 {
  margin: 0 0 6px; font-size: clamp(21px, 2.5vw, 29px); font-weight: 500;
  letter-spacing: -0.02em; text-wrap: balance;
  text-shadow: 0 0 14px var(--bg), 0 0 5px var(--bg);
}
.search {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 6px 6px 6px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: border-color 0.15s;
}
.search:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.search::before { content: ">"; color: var(--accent); font-weight: 500; }
.search input {
  flex: 1; min-width: 0; padding: 9px 0; border: 0; background: transparent;
  font-size: 14px; outline: none;
  -webkit-user-select: text; user-select: text;
}
.search input::placeholder { color: var(--ink-faint); }
.search button {
  flex: none; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px;
  background: rgba(var(--tinta), 0.05); color: var(--ink-dim);
}
.search button:hover { color: var(--ink); background: rgba(var(--tinta), 0.1); }
.search-link {
  max-width: 100%; padding: 7px 12px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--line);
  color: var(--accent); font-size: 12px; text-decoration: none; overflow-wrap: anywhere;
}
.search-link:hover { text-decoration: underline; }
[hidden] { display: none !important; }

/* riga in basso */
.hint {
  position: absolute; left: 18px; bottom: 16px; margin: 0;
  max-width: calc(100% - 84px);
  color: var(--ink-faint); font-size: 11px; pointer-events: none;
  text-shadow: 0 0 8px var(--bg);
}
.gear {
  position: absolute; right: 16px; bottom: 12px;
  width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--ink-dim); font-size: 14px; line-height: 1;
}
.gear:hover, .gear[aria-expanded="true"] { color: var(--ink); }

.panel {
  position: absolute; right: 16px; bottom: 56px; width: min(280px, calc(100% - 32px));
  display: grid; gap: 14px; padding: 16px;
  background: var(--panel-pieno); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  font-size: 12px;
}
[data-tema="chiaro"] .panel { box-shadow: 0 12px 40px rgba(70, 50, 25, 0.18); }
.panel label { display: grid; gap: 6px; color: var(--ink-dim); }
.panel label.check { display: flex; align-items: center; gap: 9px; color: var(--ink); }
.panel input[type="text"] {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: rgba(var(--tinta), 0.04); color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.panel input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
.panel button {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: rgba(var(--tinta), 0.05); text-align: left;
}
.panel button:hover { background: rgba(var(--tinta), 0.1); }
.panel kbd {
  float: right; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px;
  color: var(--ink-dim); font: inherit;
}

/* interfaccia nascosta: resta solo il pulsante, quasi invisibile */
.bare .modes, .bare .center, .bare .hint, .bare .panel { display: none; }
.bare .gear { opacity: 0.28; }
.bare .gear:hover, .bare .gear:focus-visible { opacity: 1; }

/* versione sfondo: nessuna interfaccia */
[data-sfondo] .ui { display: none; }
[data-sfondo] #zoo { cursor: default; }

/* widget: riquadri di testo ASCII in un angolo, sopra gli animali */
.widgets {
  position: fixed; display: grid; gap: 10px; margin: 0;
  pointer-events: none; z-index: 1;
  color: var(--ink-dim); font-size: 12px; line-height: 1.35;
  text-shadow: 0 0 8px var(--bg), 0 0 3px var(--bg);
}
/* --m-*: spazio occupato da barra delle applicazioni o barra dei menu, inviato dal programma */
.widgets { --gap: 24px; }
.widgets[data-angolo="basso-destra"] { right: calc(var(--gap) + var(--m-destra, 0px)); bottom: calc(var(--gap) + var(--m-basso, 0px)); justify-items: end; }
.widgets[data-angolo="basso-sinistra"] { left: calc(var(--gap) + var(--m-sinistra, 0px)); bottom: calc(var(--gap) + var(--m-basso, 0px)); }
.widgets[data-angolo="alto-destra"] { right: calc(var(--gap) + var(--m-destra, 0px)); top: calc(var(--gap) + var(--m-alto, 0px)); justify-items: end; }
.widgets[data-angolo="alto-sinistra"] { left: calc(var(--gap) + var(--m-sinistra, 0px)); top: calc(var(--gap) + var(--m-alto, 0px)); }
.widgets pre { margin: 0; font: inherit; white-space: pre; }
.widgets b { color: var(--ink); font-weight: 500; }
.widgets i { color: var(--accent); font-style: normal; }
/* un carattere che il font incorporato non ha: casella larga un carattere (vedi g() nello script) */
.widgets .g { display: inline-block; width: 1ch; text-align: center; }
.widgets[data-dimensione="piccoli"] { font-size: 10px; }
.widgets[data-dimensione="grandi"] { font-size: 15px; }
/* cornici a linee: righe più fitte, così le linee verticali si toccano quasi */
.widgets[data-cornice="linee"], .widgets[data-cornice="arrotondata"] { line-height: 1.2; }
.widgets[data-sfondo="pieno"] pre { background: var(--widget-fondo); box-shadow: 0 6px 24px var(--widget-ombra); border-radius: 2px; }
.widgets[data-sfondo="pieno"][data-cornice="arrotondata"] pre { border-radius: 0.6em; }
.widgets pre.lampo, .widgets pre.lampo b, .widgets pre.lampo i { color: var(--widget-lampo); }

/* con animali e paesaggi i nomi non stanno tutti: sotto i 1600px solo il pallino (il nome
   di quello scelto resta) */
@media (max-width: 1600px) {
  .modes button { padding: 7px 9px; }
  .modes button:not([aria-pressed="true"]) span { display: none; }
}
@media (max-width: 760px) {
  .hint { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<canvas id="glow" aria-hidden="true"></canvas>
<canvas id="zoo" aria-hidden="true"></canvas>

<div class="widgets" id="widgets" data-angolo="basso-destra" aria-live="off"></div>

<div class="ui" id="ui">
  <nav class="modes" id="modes" aria-label="Scegli l'animale"></nav>

  <main class="center">
    <p class="clock" id="clock"></p>
    <h1 id="greeting">Ciao</h1>
    <form class="search" id="search" role="search" autocomplete="off">
      <label class="sr" for="q">Cerca sul web o scrivi un indirizzo</label>
      <input id="q" name="q" type="text" placeholder="Cerca o scrivi un indirizzo" spellcheck="false" autocapitalize="off">
      <button type="submit" id="go" aria-label="Cerca">&#8629;</button>
    </form>
    <a class="search-link" id="search-link" target="_blank" rel="noopener" hidden></a>
  </main>

  <p class="hint" id="hint"></p>

  <div class="panel" id="panel" hidden>
    <label for="name">Il tuo nome, per il saluto
      <input id="name" type="text" maxlength="24" placeholder="facoltativo" autocomplete="off">
    </label>
    <label class="check" for="auto">
      <input id="auto" type="checkbox">
      Cambia animale ogni minuto
    </label>
    <button type="button" id="foto">Scarica una foto dello sfondo <kbd>P</kbd></button>
    <button type="button" id="hide">Nascondi l'interfaccia <kbd>H</kbd></button>
  </div>
  <button class="gear" id="gear" type="button" aria-label="Impostazioni" aria-expanded="false" aria-controls="panel">&#9881;&#xFE0E;</button>
</div>

<script>
/* ASCII Zoo — motore.
 * Ogni animale è una forma procedurale campionata su una griglia di celle:
 * ogni cella accesa diventa un carattere da tastiera, colorato. */
(function (global) {
  'use strict';

  // tempi dell'avvio (ms dall'inizio della pagina), per il log del programma: vedi Zoo.TEMPI
  var ora = function () { return global.performance ? global.performance.now() : 0; };
  var TEMPI = { motore: Math.round(ora()), atlanti: 0, atlante_ms: 0 };

  var TAU = Math.PI * 2;
  var FLOW = -Math.PI / 4; // direzione "di corrente": in alto a destra
  var RAMP_A = '.,:-~;=+*oxX%#&@';
  var RAMP_B = "`'.:_!|/<>aeO08$";
  var LEVELS = 16;

  // Colori comuni a tutte le modalità: 0 = onda del clic, 1 = cibo,
  // 2 = cifre dell'orologio, 3 = segmenti spenti
  // comuni a tutti: 0 onda, 1 cibo, 2 cifre, 3 segmenti spenti, 4 neve delle feste (vedi neveFeste)
  var PALETTE = ['#aab3c5', '#f0d9a0', '#e6e9f2', '#4a5064', '#eef3ff'];

  // Orologio a sette segmenti (a..g): quali segmenti accende ogni cifra
  var DIGITS = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
  var SEGS = 'abcdefg';
  // segmenti di una cifra larga W e alta H celle, tratto di raggio r
  function segments(ox, oy, W, H, r) {
    var x0 = ox + r, x1 = ox + W - r, y0 = oy + r, y1 = oy + H - r, ym = oy + H / 2, g = r * 0.6;
    return [
      [x0 + g, y0, x1 - g, y0], [x1, y0 + g, x1, ym - g], [x1, ym + g, x1, y1 - g],
      [x0 + g, y1, x1 - g, y1], [x0, ym + g, x0, y1 - g], [x0, y0 + g, x0, ym - g],
      [x0 + g, ym, x1 - g, ym]
    ];
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function angDiff(a, b) { return Math.atan2(Math.sin(a - b), Math.cos(a - b)); }
  function hash2(i, j) {
    var n = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function steer(c, target, rate, dt) {
    c.th += clamp(angDiff(target, c.th), -rate * dt, rate * dt);
  }
  // distanza punto-segmento; segT() dà poi la posizione lungo il segmento (0..1)
  var _t = 0;
  function segD(px, py, ax, ay, bx, by) {
    var vx = bx - ax, vy = by - ay;
    var t = ((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    _t = t;
    var dx = px - ax - vx * t, dy = py - ay - vy * t;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function segT() { return _t; }
  // rumore morbido 2D (0..1) e la sua somma a più ottave: per le cose che ondeggiano
  // (nuvole, onde, l'aurora). Lo stesso di dreams/src/grid.rs.
  function liscia(t) { return t * t * (3 - 2 * t); }
  function rumore(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = liscia(x - xi), yf = liscia(y - yi);
    var a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    var ab = a + (b - a) * xf, cd = c + (d - c) * xf;
    return ab + (cd - ab) * yf;
  }
  function frattale(x, y, ottave) {
    var tot = 0, amp = 1, freq = 1, norm = 0;
    for (var i = 0; i < ottave; i++) { tot += rumore(x * freq, y * freq) * amp; norm += amp; amp *= 0.5; freq *= 2; }
    return tot / norm;
  }
  function advance(c, dt) {
    c.x += Math.cos(c.th) * c.sp * dt;
    c.y += Math.sin(c.th) * c.sp * dt;
  }
  // volo verso un punto (l'orologio), rallentando all'arrivo
  function goTo(c, turn, vmax, k, acc, dt) {
    var dx = c.goal.x - c.x, dy = c.goal.y - c.y, d = Math.sqrt(dx * dx + dy * dy);
    steer(c, Math.atan2(dy, dx), turn, dt);
    var v = Math.min(vmax, 0.5 + d * k);
    c.sp += (v - c.sp) * Math.min(1, acc * dt);
    advance(c, dt);
  }
  function defaultPoke(c, x, y, w) {
    var dx = c.x - x, dy = c.y - y, d = Math.sqrt(dx * dx + dy * dy);
    if (d > w.pokeR) return false;
    c.flee = 0.8 + 0.9 * (1 - d / w.pokeR);
    c.fleeTh = d < 0.01 ? w.rnd() * TAU : Math.atan2(dy, dx);
    return true;
  }

  /* ------------------------------------------------------------------ */
  /* Specie. Coordinate locali: x in avanti, y di lato, unità = taglia. */
  /* shape() scrive o.v (intensità 0..1) e o.c (indice colore locale).   */
  /* ------------------------------------------------------------------ */

  var SPECIES = [];

  // ==== animale: farfalle ====
  SPECIES.push({
    id: 'farfalle', label: 'Farfalle', dot: '#5aa7ff',
    pal: ['#eaf4ff', '#a9d6ff', '#58a4ff', '#2f66d0'],
    dens: 560, min: 7, max: 26, smin: 3.6, smax: 11, off: 0, rad: 0.78,
    perch: 0.5, // si posano sull'orologio se la taglia è sotto 0.5 × altezza cifre
    spawn: function (c, w) {
      c.th = w.rnd() * TAU; c.rate = 8 + w.rnd() * 5; c.dth = 0;
    },
    update: function (c, dt, t, w) {
      if (c.perched) { c.ph += c.rate * 0.12 * dt; c.sp = 0; return; } // ali che si aprono piano
      var fl = c.flee > 0;
      c.ph += c.rate * (fl ? 1.9 : 1) * dt;
      if (c.goal && !fl) { goTo(c, 6, 2.2 + 3.8 * c.z, 1.2, 5, dt); return; }
      c.dth += (w.rnd() - 0.5) * 10 * dt;
      c.dth *= Math.pow(0.2, dt);
      if (fl) steer(c, c.fleeTh, 7, dt);
      else c.th += (c.dth + Math.sin(t * 0.9 + c.seed * 9) * 0.6) * dt;
      var base = (2.2 + 3.8 * c.z) * (1 + 0.45 * Math.sin(c.ph));
      c.sp += ((fl ? base * 3.6 : base) - c.sp) * Math.min(1, 5 * dt);
      advance(c, dt);
    },
    shape: function (x, y, c, o) {
      var ay = y < 0 ? -y : y;
      if (ay < Math.max(0.045, c.mt * 0.9) && x > -0.34 && x < 0.36) { o.v = 0.7; o.c = 3; return; }
      var f = 0.22 + 0.78 * Math.abs(Math.cos(c.ph));
      var wy = ay / f;
      var ax = (x - 0.2) / 0.24, bx = (wy - 0.36) / 0.3;
      var d1 = ax * ax + bx * bx;
      ax = (x + 0.24) / 0.17; bx = (wy - 0.24) / 0.19;
      var d2 = ax * ax + bx * bx;
      var d = d1 < d2 ? d1 : d2;
      if (d < 1) {
        o.v = 1 - 0.5 * d;
        o.c = d < 0.3 ? 1 : d < 0.8 ? 2 : 3;
      }
    }
  });
  // ==== fine farfalle ====

  // ==== animale: meduse ====
  SPECIES.push({
    id: 'meduse', label: 'Meduse', dot: '#e45bd0',
    pal: ['#ffd9f7', '#ee6fdc', '#b03aa6', '#8d86a6'],
    dens: 720, min: 6, max: 20, smin: 3.6, smax: 11, off: -0.95, rad: 1.5,
    spawn: function (c, w) {
      c.home = FLOW + (w.rnd() - 0.5) * 0.5; c.th = c.home; c.rate = 1.9 + w.rnd() * 0.9;
    },
    update: function (c, dt, t, w) {
      var fl = c.flee > 0;
      c.ph += c.rate * (fl ? 2.2 : 1) * dt;
      if (fl) steer(c, c.fleeTh, 3.5, dt);
      else steer(c, c.home + Math.sin(t * 0.4 + c.seed * 7) * 0.25, 0.8, dt);
      var push = Math.max(0, Math.sin(c.ph));
      var target = (0.9 + 2.6 * c.z) * (0.45 + 1.5 * push) * (fl ? 3 : 1);
      c.sp += (target - c.sp) * Math.min(1, 3 * dt);
      advance(c, dt);
    },
    shape: function (x, y, c, o, h) {
      var p = Math.sin(c.ph);
      if (x >= -0.12) {
        var rx = 0.44 * (1 - 0.12 * p), ry = 0.48 * (1 + 0.14 * p);
        var d = (x / rx) * (x / rx) + (y / ry) * (y / ry);
        if (d < 1) {
          o.v = 1 - 0.45 * d;
          o.c = x < -0.04 ? 2 : (x > 0.12 && d < 0.42) ? 0 : d < 0.8 ? 1 : 2;
        }
        return;
      }
      if (x < -2.3 || h < 0.38) return;
      var spread = 0.16 * (1 + 0.12 * p), fade = 1 + x / 2.3;
      var th = Math.max(0.05, c.mt);
      for (var k = -2; k <= 2; k++) {
        var wig = 0.035 * Math.sin(x * 5 + c.ph * 1.5 + k * 1.7) * -x;
        if (Math.abs(y - k * spread - wig) < th) {
          o.v = 0.05 + 0.13 * fade; o.c = 3; return;
        }
      }
    }
  });
  // ==== fine meduse ====

  // ==== animale: libellule ====
  SPECIES.push({
    id: 'libellule', label: 'Libellule', dot: '#3fe0b0',
    pal: ['#f2fff9', '#62f0b4', '#27b99a', '#8fe6cf', '#3d8f86'],
    dens: 600, min: 7, max: 22, smin: 4.2, smax: 10, off: -0.85, rad: 1.9,
    perch: 0.65,
    spawn: function (c, w) {
      c.home = FLOW + (w.rnd() - 0.5) * 0.9; c.th = c.home;
      c.state = w.rnd() < 0.7 ? 1 : 0; c.timer = w.rnd() * 1.5; c.next = c.th;
    },
    update: function (c, dt, t, w) {
      if (c.perched) { c.ph += 5 * dt; c.sp = 0; return; } // posata: le ali vibrano appena
      c.ph += 38 * dt;
      if (c.goal && !(c.flee > 0)) { c.state = 1; goTo(c, 9, 9 + 13 * c.z, 2.5, 7, dt); c.next = c.th; return; }
      c.timer -= dt;
      if (c.flee > 0) { c.state = 1; c.next = c.fleeTh; if (c.timer < c.flee) c.timer = c.flee; }
      if (c.timer <= 0) {
        if (c.state === 1) { c.state = 0; c.timer = 0.35 + w.rnd() * 1.2; }
        else {
          c.state = 1; c.timer = 0.6 + w.rnd() * 1.6;
          c.next = w.rnd() < 0.8 ? c.home + (w.rnd() - 0.5) * 1.7 : w.rnd() * TAU;
        }
      }
      steer(c, c.next, c.state === 1 ? 9 : 3, dt);
      var target = c.state === 1 ? (9 + 13 * c.z) * (c.flee > 0 ? 1.6 : 1) : 0.5;
      c.sp += (target - c.sp) * Math.min(1, (c.state === 1 ? 7 : 4) * dt);
      advance(c, dt);
    },
    shape: function (x, y, c, o, h) {
      var ay = y < 0 ? -y : y, mt = c.mt;
      var hx = x - 0.3;
      if (hx * hx + y * y < Math.max(0.008, mt * mt * 0.5)) { o.v = 1; o.c = 0; return; }
      var tx = (x - 0.14) / 0.16, ty = y / 0.09;
      if (tx * tx + ty * ty < 1) { o.v = 0.92; o.c = 1; return; }
      if (ay < Math.max(0.035, mt)) {
        if (x > -0.95 && x < 0.05) { o.v = 0.62; o.c = 2; return; }
        var tl = 0.3 + c.sp * 0.07;
        if (x <= -0.95 && x > -0.95 - tl && h > 0.45) {
          o.v = 0.04 + 0.16 * (1 + (x + 0.95) / tl); o.c = 4; return;
        }
      }
      if (ay > 0.05 && ay < 0.64) {
        var taper = 1 - (ay / 0.64) * (ay / 0.64);
        var th = Math.max(0.03 + 0.09 * taper, mt * 0.7);
        var fore = Math.abs(x - (0.22 + 0.16 * ay));
        var hind = Math.abs(x - (0.02 - 0.3 * ay));
        if ((fore < th || hind < th) && h > 0.18) {
          o.v = 0.42 + 0.22 * Math.sin(c.ph + ay * 9); o.c = 3;
        }
      }
    }
  });
  // ==== fine libellule ====

  // ==== animale: koi ====
  SPECIES.push({
    id: 'koi', label: 'Koi', dot: '#ffb347',
    // 7-8 = acqua, 9-10 = ninfee, 11 = fiore di loto
    pal: ['#f6f2e9', '#e8402f', '#ff8f2e', '#dc5a16', '#ffd447', '#6d7282', '#c9ced8',
          '#3c7fa6', '#7cc4e0', '#4fae57', '#2f7a3a', '#f4a6c8'],
    dens: 520, min: 7, max: 26, smin: 4.6, smax: 12.5, off: -0.12, rad: 0.78,
    feeds: true,
    // stagno: increspature che scorrono sotto i pesci
    under: function (w, t, A) {
      var c0 = this.c0, cols = w.cols, rows = w.rows, wc = w._water, i, j, n;
      if (!wc || wc.cols !== cols || wc.rows !== rows) {
        // le celle dove l'acqua può comparire sono sempre le stesse (poco più di metà)
        var ii = [], jj = [], aa = [];
        for (j = 0; j < rows; j++) {
          for (i = 0; i < cols; i++) {
            var h = hash2(i, j);
            if (h < 0.55) { ii.push(i); jj.push(j); aa.push(0.35 + 0.3 * h); }
          }
        }
        wc = w._water = { cols: cols, rows: rows, i: Int16Array.from(ii), j: Int16Array.from(jj), a: Float32Array.from(aa),
                          row: new Float32Array(rows), col: new Float32Array(cols) };
      }
      // s = sin(i*0.16 + t*0.8 + sin(j*0.11 + t*0.35)*2.2) + sin(j*0.23 - t*0.6 + sin(i*0.07 - t*0.25)*1.8):
      // i seni interni dipendono solo dalla riga o solo dalla colonna
      var R = wc.row, K = wc.col, I = wc.i, J = wc.j, AL = wc.a;
      for (j = 0; j < rows; j++) R[j] = t * 0.8 + Math.sin(j * 0.11 + t * 0.35) * 2.2;
      for (i = 0; i < cols; i++) K[i] = Math.sin(i * 0.07 - t * 0.25) * 1.8 - t * 0.6;
      for (n = 0; n < I.length; n++) {
        i = I[n]; j = J[n];
        var s1 = Math.sin(i * 0.16 + R[j]);
        if (s1 <= 0.45) continue; // il secondo seno arriva al massimo a 1: non si supera 1.45
        var s = s1 + Math.sin(j * 0.23 + K[i]);
        if (s > 1.45) w.put(i, j, 0.08 + (s - 1.45) * 0.3, c0 + (s > 1.75 ? 8 : 7), A * AL[n]);
      }
    },
    // ninfee che vanno alla deriva; i pesci profondi passano sotto
    tick: function (w, dt) {

  // ==== fine gatti ====

  // ==== animale: topi ====

    update: function (c, dt, t, w) {

        var gx = f.x + Math.cos(c.posto) * R, gy = f.y + Math.sin(c.posto) * R, dx = gx - c.x, dy = gy - c.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d > 0.7) { steer(c, Math.atan2(dy, dx), 10, dt); target = Math.min(10 + 5 * c.z, 1 + d * 4); }
        else {

        }

          else { c.state = 1; c.timer = 0.25 + w.rnd() * 0.8; c.th += (w.rnd() - 0.5) * (w.rnd() < 0.3 ? 3.5 : 1.4); }

    shape: function (x, y, c, o) {

  // ==== fine topi ====

  /* ------------------------------------------------------------------ */
  /* Scenografie: lo sfondo di ogni specie. Hanno uno stato proprio      */
  /* (rifatto se cambia la griglia), possono offrire posti dove posarsi  */
  /* (fiori, canne, nidi, sassi) e ostacoli da aggirare (sassi).         */
  /* I colori della scena seguono quelli della specie: C = c0 + sc0.     */
  /* ------------------------------------------------------------------ */

  function byId(id) {

    return null;
  }
  // un punto libero: lontano dall'orologio e dagli altri oggetti della lista
  function place(w, r, list, gap) {
    var x = 0, y = 0;
    for (var t = 0; t < 40; t++) {
      x = r + w.rnd() * Math.max(1, w.cols - 2 * r);
      y = r + w.rnd() * Math.max(1, w.rows - 2 * r);
      if (w.clock && w.boxDist(x, y).d < r + 3) continue;
      var ok = true;
      for (var k = 0; k < list.length && ok; k++) {
        var o = list[k], dx = o.x - x, dy = o.y - y, m = o.r + r + gap;
        if (dx * dx + dy * dy < m * m) ok = false;
      }
      if (ok) break;

  }
  // celle fisse: i, j, v, colore (relativo alla scena), alfa
  function drawCells(w, cells, C, A) {

  }
  // sasso irregolare, illuminato da in alto a sinistra
  function rockCells(w, o, cells, dark, light, moss) {
    var R = o.r * 1.3, i0 = Math.floor(o.x - R), i1 = Math.ceil(o.x + R), j0 = Math.floor(o.y - R), j1 = Math.ceil(o.y + R);
    for (var j = j0; j <= j1; j++) {
      for (var i = i0; i <= i1; i++) {
        var dx = i + 0.5 - o.x, dy = j + 0.5 - o.y, dd = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx);
        var rr = o.r * (1 + 0.16 * Math.sin(3 * a + o.p1) + 0.09 * Math.sin(5 * a + o.p2));

  // ==== animale: farfalle ====

  SCENES.farfalle = {
    pal: ['#24452c', '#3f7a45', '#f4a6c8', '#f6f2e9', '#c4a3f0', '#ffd447', '#ff9a5a'],
    init: function (w) {

    },
    tick: function (w, dt, t, s) {

    under: function (w, t, A, s) {

  };
  // ==== fine farfalle ====

  // ==== animale: libellule ====

  SCENES.libellule = {

    under: function (w, t, A, s) {

  };
  // ==== fine libellule ====

  // ==== animale: rane ====
  // Rane: prato con ciuffi d'erba, sassi (ci si siedono), pozzanghere (schizzi
  // quando ci atterrano) e lucciole che scappano dalle rane, o finiscono mangiate.
  SCENES.rane = {
    pal: ['#24452c', '#4f8a3f', '#6d7280', '#a3a8b4', '#46703a', '#24506b', '#7cc4e0', '#e9ff7a'],
    init: function (w) {

      for (k = 0; k < n; k++) {

      }

        s.puddles.push({ x: pp.x, y: pp.y, r: rx, rx: rx, ry: rx * (0.5 + w.rnd() * 0.2) });
      }
      var avoid = s.stones.concat(s.puddles);
      n = clamp(Math.round(w.cols * w.rows / 180), 25, 160);
      for (k = 0; k < n; k++) {
        var tp = place(w, 1.5, avoid, 0.5), blades = [];
        for (var b = 0, nb = 4 + Math.floor(w.rnd() * 3); b < nb; b++) blades.push(w.rnd() * TAU, 1.2 + w.rnd() * 1.6);
        s.tufts.push({ x: tp.x, y: tp.y, ph: w.rnd() * TAU, blades: blades, dark: w.rnd() < 0.5 });
      }
      s.stones.forEach(function (o) { rockCells(w, o, s.cells, 2, 3, 4); });
      n = clamp(Math.round(w.cols * w.rows / 900), 8, 28);
      for (k = 0; k < n; k++) s.flies.push({ x: w.rnd() * w.cols, y: w.rnd() * w.rows, vx: 0, vy: 0, ph: w.rnd() * TAU, rate: 1.5 + w.rnd() * 2, off: 0 });
      return s;
    },
    tick: function (w, dt, t, s) {
      var sp = this, cs = w.creatures, C = this.c0 + this.sc0, q, n, c;
      for (n = 0; n < cs.length; n++) {
        c = cs[n];
        if (c.kind !== sp || c.dying) continue;
        var landed = c._air > 0 && !(c.air > 0);
        c._air = c.air;
        if (!landed) continue;
        for (q = 0; q < s.puddles.length; q++) {
          var pd = s.puddles[q], ex = (c.x - pd.x) / pd.rx, ey = (c.y - pd.y) / pd.ry;
          if (ex * ex + ey * ey < 1) w.ripple(c.x, c.y, 2.5 + c.S * 0.25, 1.2, C + 6); // splash!
        }
        for (q = 0; q < s.flies.length; q++) {
          var fl = s.flies[q];
          if (fl.off > 0) continue;
          var dx = fl.x - c.x, dy = fl.y - c.y;
          if (dx * dx + dy * dy < 6 && w.rnd() < 0.5) { fl.off = 6 + w.rnd() * 8; w.ripple(fl.x, fl.y, 1.6, 0.5, C + 7); }
        }
      }
      for (q = 0; q < s.flies.length; q++) {
        var f = s.flies[q];
        if (f.off > 0) {
          if ((f.off -= dt) <= 0) { f.x = w.rnd() * w.cols; f.y = w.rnd() * w.rows; }
          continue;
        }
        f.vx += (w.rnd() - 0.5) * 3 * dt; f.vy += (w.rnd() - 0.5) * 3 * dt;
        for (n = 0; n < cs.length; n++) {
          c = cs[n];
          if (c.kind !== sp || c.dying) continue;
          var ddx = f.x - c.x, ddy = f.y - c.y, d2 = ddx * ddx + ddy * ddy;
          if (d2 < 25 && d2 > 1e-4) { var d = Math.sqrt(d2); f.vx += ddx / d * 4 * dt; f.vy += ddy / d * 4 * dt; }
        }
        var sv = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
        if (sv > 2.2) { f.vx *= 2.2 / sv; f.vy *= 2.2 / sv; }
        f.vx *= Math.pow(0.6, dt); f.vy *= Math.pow(0.6, dt);
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (w.clock) { var bd = w.boxDist(f.x, f.y); if (bd.d < 1) { f.x += bd.nx * dt * 3; f.y += bd.ny * dt * 3; f.vx += bd.nx; f.vy += bd.ny; } }
        if (f.x < -2) f.x = w.cols + 2; else if (f.x > w.cols + 2) f.x = -2;
        if (f.y < -2) f.y = w.rows + 2; else if (f.y > w.rows + 2) f.y = -2;
      }
    },
    under: function (w, t, A, s) {
      var C = this.c0 + this.sc0, q, i, j;
      for (q = 0; q < s.puddles.length; q++) {
        var p = s.puddles[q];
        for (j = Math.floor(p.y - p.ry); j <= Math.ceil(p.y + p.ry); j++) {
          for (i = Math.floor(p.x - p.rx); i <= Math.ceil(p.x + p.rx); i++) {
            var ex = (i + 0.5 - p.x) / p.rx, ey = (j + 0.5 - p.y) / p.ry, e = ex * ex + ey * ey;
            if (e >= 1) continue;
            var sh = Math.sin(i * 0.5 + t * 1.3 + j * 0.8);
            w.put(i, j, 0.16 + 0.1 * sh, C + (e < 0.75 && sh > 0.6 ? 6 : 5), A * 0.7);
          }
        }
      }
      for (q = 0; q < s.tufts.length; q++) {
        var tf = s.tufts[q], sway = Math.sin(t * 1.1 + tf.ph) * 0.25, col = C + (tf.dark ? 0 : 1);
        w.put(Math.floor(tf.x), Math.floor(tf.y), 0.3, col, A * 0.7);
        for (var b = 0; b < tf.blades.length; b += 2) {
          var a = tf.blades[b] + sway, L = tf.blades[b + 1];
          for (var e2 = 0.8; e2 <= L; e2 += 0.8) w.put(Math.floor(tf.x + Math.cos(a) * e2), Math.floor(tf.y + Math.sin(a) * e2), 0.24 + 0.08 * (1 - e2 / L), col, A * 0.65);
        }
      }
      drawCells(w, s.cells, C, A);
    },
    over: function (w, t, A, s) {
      var C = this.c0 + this.sc0;
      for (var q = 0; q < s.flies.length; q++) {
        var f = s.flies[q];
        if (f.off > 0) continue;
        var b = Math.max(0, Math.sin(t * f.rate + f.ph));
        b = b * b * b;
        if (b > 0.05) w.put(Math.floor(f.x), Math.floor(f.y), 0.45 + 0.45 * b, C + 7, A * b);
      }
    },
    spots: function (w, s) { return s.stones; }
  };
  // ==== fine rane ====

  // ==== animale: aironi ====
  // Aironi: nidi di rametti con le uova. Gli aironi ci tornano, chiudono le ali
  // e covano; dopo un po' di cova le uova si schiudono.
  SCENES.aironi = {
    pal: ['#5a3d24', '#8f6a42', '#c9a77a', '#e4edf2', '#9fd0e0', '#ffe08a', '#ff9a3c', '#2c3a2c'],
    init: function (w) {
      var s = { nests: [], cells: [] }, n = clamp(Math.round(w.cols * w.rows / 4500), 2, 6);
      for (var k = 0; k < n; k++) {
        var r = 3.6 + w.rnd() * 1.6, p = place(w, r, s.nests, 6), eggs = [], ne = 2 + Math.floor(w.rnd() * 2);
        for (var e = 0; e < ne; e++) { var a = e / ne * TAU + w.rnd(); eggs.push(Math.cos(a) * r * 0.24, Math.sin(a) * r * 0.24); }
        s.nests.push({ x: p.x, y: p.y, r: r, eggs: eggs, warm: 0, chicks: false, taken: null });
      }
      for (var j = 0; j < w.rows; j++) {
        for (var i = 0; i < w.cols; i++) if (hash2(i * 11 + 2, j * 7 + 9) < 0.025) s.cells.push(i, j, 0.09, 7, 0.5);
      }
      return s;
    },
    tick: function (w, dt, t, s) {
      for (var q = 0; q < s.nests.length; q++) {
        var n = s.nests[q];
        if (n.taken && n.taken.perched) n.warm += dt;
        if (!n.chicks && n.warm > 25) { n.chicks = true; w.ripple(n.x, n.y, n.r + 2, 1, this.c0 + this.sc0 + 5); }
      }
    },
    under: function (w, t, A, s) {
      var C = this.c0 + this.sc0;
      drawCells(w, s.cells, C, A);
      for (var q = 0; q < s.nests.length; q++) {
        var n = s.nests[q], R = n.r;
        for (var j = Math.floor(n.y - R); j <= Math.ceil(n.y + R); j++) {
          for (var i = Math.floor(n.x - R); i <= Math.ceil(n.x + R); i++) {
            var dx = i + 0.5 - n.x, dy = j + 0.5 - n.y, d = Math.sqrt(dx * dx + dy * dy) / R;
            if (d >= 1) continue;
            if (d > 0.52) w.put(i, j, 0.4 + 0.2 * hash2(i, j), C + (hash2(i * 7, j * 3) < 0.5 ? 0 : 1), A * 0.9);
            else w.put(i, j, 0.26, C + 2, A * 0.8);
          }
        }
        for (var e = 0; e < n.eggs.length; e += 2) {
          var ex = n.x + n.eggs[e], ey = n.y + n.eggs[e + 1];
          if (n.chicks) {
            w.put(Math.floor(ex), Math.floor(ey), 0.7, C + 5, A);
            if (Math.sin(t * 6 + e * 1.7) > 0.3) w.put(Math.floor(ex + 1), Math.floor(ey), 0.6, C + 6, A); // pio pio
          } else {
            w.put(Math.floor(ex), Math.floor(ey), 0.62, C + (e % 4 ? 4 : 3), A);
          }
        }
      }
    },
    spots: function (w, s) { return s.nests; }
  };
  // ==== fine aironi ====

  // ==== animale: meduse ====
  // Meduse: fondale con raggi di luce che scendono e bolle che salgono.
  // Le meduse spostano le bolle; contro l'orologio le bolle scoppiano.
  SCENES.meduse = {
    pal: ['#bfe8ff', '#16304f', '#2f5f8f'],
    init: function (w) {
      var s = { bubbles: [], rays: [], acc: 0 };
      for (var j = 0; j < w.rows; j++) {
        for (var i = 0; i < w.cols; i++) if (hash2(i * 13 + 5, j * 3 + 11) < 0.07) s.rays.push(i, j);
      }
      return s;
    },
    tick: function (w, dt, t, s) {
      var sp = this, cs = w.creatures, C = this.c0 + this.sc0, b, q;
      s.acc += dt * w.cols * 0.012;
      while (s.acc >= 1 && s.bubbles.length < 260) {
        s.acc -= 1;
        var r = 0.3 + Math.pow(w.rnd(), 3) * 1.4;
        s.bubbles.push({ x: w.rnd() * w.cols, y: w.rows + 1 + w.rnd() * 3, r: r, vy: -(1.3 + w.rnd() * 1.2) * (1 + r * 0.6),
                         ph: w.rnd() * TAU, amp: 0.3 + w.rnd() * 0.6, vx: 0 });
      }
      if (s.acc > 1) s.acc = 1;
      for (q = s.bubbles.length - 1; q >= 0; q--) {
        b = s.bubbles[q];
        b.y += b.vy * dt;
        b.x += (Math.sin(t * 1.8 + b.ph) * b.amp + b.vx) * dt;
        b.vx *= Math.pow(0.2, dt);
        for (var n = 0; n < cs.length; n++) {
          var c = cs[n];
          if (c.kind !== sp || c.dying) continue;
          var dx = b.x - c.x, dy = b.y - c.y, R = c.S * 0.5 + b.r, d2 = dx * dx + dy * dy;
          if (d2 < R * R && d2 > 1e-4) { var d = Math.sqrt(d2); b.vx += dx / d * 8 * dt * (1 + c.sp); }
        }
        var pop = b.y < -2;
        if (!pop && w.clock && w.boxDist(b.x, b.y).d < b.r) { pop = true; w.ripple(b.x, b.y, 1.2 + b.r, 0.6, C); }
        if (pop) s.bubbles.splice(q, 1);
      }
    },
    under: function (w, t, A, s) {
      var C = this.c0 + this.sc0, rays = s.rays;
      for (var k = 0; k < rays.length; k += 2) {
        var i = rays[k], j = rays[k + 1], band = Math.sin((i * 0.9 - j * 0.45) * 0.07 + t * 0.12);
        if (band > 0.8) w.put(i, j, 0.08 + (band - 0.8) * 0.5, C + (band > 0.93 ? 2 : 1), A * 0.5);
      }
    },
    over: function (w, t, A, s) {
      var C = this.c0 + this.sc0;
      for (var q = 0; q < s.bubbles.length; q++) {

        var n = Math.ceil(TAU * b.r * 1.6);
        for (var k = 0; k < n; k++) {
          var a = k / n * TAU;
          w.put(Math.floor(b.x + Math.cos(a) * b.r), Math.floor(b.y + Math.sin(a) * b.r), 0.3, C, A * 0.7);
        }
        w.put(Math.floor(b.x - b.r * 0.4), Math.floor(b.y - b.r * 0.4), 0.62, C, A * 0.8); // riflesso
      }
    }
  };
  // ==== fine meduse ====

  // ==== animale: granchi ====
  // Granchi: sabbia con le increspature, conchiglie, sassi (da aggirare) e
  // le impronte che i granchi lasciano camminando, che il tempo cancella.
  SCENES.granchi = {
    pal: ['#7d6848', '#c2a574', '#6d7280', '#a3a8b4', '#46503d', '#f1d9c4', '#e89aa8', '#a88c62'],
    init: function (w) {
      var s = { sand: [], rocks: [], cells: [], prints: [] }, i, j, k, n;
      for (j = 0; j < w.rows; j++) {
        for (i = 0; i < w.cols; i++) {
          var rr = Math.sin(i * 0.21 + j * 0.05 + Math.sin(j * 0.12 + i * 0.01) * 2.2), h = hash2(i * 7 + 3, j * 11 + 5);

          else if (h < 0.012) s.sand.push(i, j, 0.07, 0, 0.5);

      }

        var r = 2.2 + w.rnd() * 3.2, p = place(w, r, s.rocks, 3);
        s.rocks.push({ x: p.x, y: p.y, r: r, p1: w.rnd() * TAU, p2: w.rnd() * TAU, moss: w.rnd() < 0.5 });
      }

      for (k = 0; k < n; k++) {
        var sp2 = place(w, 1, s.rocks, 2), sc = w.rnd() < 0.5 ? 5 : 6;
        s.sand.push(Math.floor(sp2.x), Math.floor(sp2.y), 0.55, sc, 0.9, Math.floor(sp2.x) + 1, Math.floor(sp2.y), 0.4, sc, 0.8);
      }

    },
    tick: function (w, dt, t, s) {

        s.prints.push({ x: c.x + nx, y: c.y + ny, age: 0 }, { x: c.x - nx, y: c.y - ny, age: 0 });
      }
      for (q = s.prints.length - 1; q >= 0; q--) if ((s.prints[q].age += dt) > 12) s.prints.splice(q, 1);
      if (s.prints.length > 300) s.prints.splice(0, s.prints.length - 300);
    },
    under: function (w, t, A, s) {

      drawCells(w, s.sand, C, A);

  // ==== fine granchi ====

  // ==== animale: cavalli ====
  // Cavalli: prateria con l'erba mossa dal vento (le raffiche passano come onde
  // chiare che piegano i fili), fiori di campo e una staccionata in basso, a tratti.
  // Al galoppo i cavalli alzano la polvere.
  SCENES.cavalli = {
    pal: ['#2b4a2a', '#4f7d38', '#b4c46a', '#f4f0e0', '#ffd447', '#b48ce6', '#6e5236', '#a5804f', '#b49a78'],
    init: function (w) {
      var s = { flowers: [], cells: [], dust: [], row: new Float32Array(w.rows), col: new Float32Array(w.cols), amp: new Float32Array(w.cols) };
      var b = w.clock ? w.clock.box : null, fy = w.rows - 4, bi = [], bj = [], bh = [], i, j, k;
      for (j = 1; j < fy; j++) {
        s.row[j] = Math.sin(j * 0.045) * 1.6 + j * 0.03; // fronti delle raffiche un po' curvi
        for (i = 0; i < w.cols; i++) {
          var h = hash2(i * 5 + 11, j * 7 + 3);
          if (h >= 0.065) continue;
          if (b && i >= b.x0 - 1 && i <= b.x1 + 1 && j >= b.y0 - 1 && j <= b.y1 + 2) continue;
          bi.push(i); bj.push(j); bh.push(h < 0.01 ? 3 : h < 0.035 ? 2 : 1);
        }
      }
      s.bi = Int16Array.from(bi); s.bj = Int16Array.from(bj); s.bh = Uint8Array.from(bh);
      var n = clamp(Math.round(w.cols * w.rows / 420), 10, 48), fc = [3, 3, 4, 4, 5];
      for (k = 0; k < n; k++) {
        var p = place(w, 1.2, s.flowers, 2.5);
        if (p.y < fy - 1) s.flowers.push({ x: Math.floor(p.x), y: Math.floor(p.y), r: 1.2, c: fc[Math.floor(w.rnd() * fc.length)], h: w.rnd() < 0.5 ? 1 : 2 });
      }
      // staccionata: tratti con un palo ogni 6 celle e due traverse, e qualche varco
      for (i = Math.floor(w.rnd() * 8); i < w.cols - 3;) {
        var len = 18 + Math.floor(w.rnd() * 26), end = Math.min(w.cols - 1, i + len);
        for (k = i; k <= end; k++) {
          var post = (k - i) % 6 === 0 || k === end;
          if (post) for (j = fy; j < w.rows; j++) s.cells.push(k, j, j === fy ? 0.6 : 0.48, j === fy ? 7 : 6, 0.9);
          else {
            s.cells.push(k, fy, 0.4, 7, 0.8, k, fy + 2, 0.34, 6, 0.75);
            if (hash2(k, 77) < 0.3) s.cells.push(k, w.rows - 1, 0.16, 1, 0.6); // erba ai piedi
          }
        }
        i = end + 6 + Math.floor(w.rnd() * 16);
      }
      return s;
    },
    tick: function (w, dt, t, s) {
      var sp = this, cs = w.creatures, D = s.dust, q;
      for (q = 0; q < cs.length; q++) {
        var c = cs[q];
        if (c.kind !== sp || c.dying || c.sp < c.S * 1.1) continue;
        c._du = (c._du || 0) + c.sp * dt;
        if (c._du < 1.2) continue;
        c._du = 0;
        if (D.length < 160) {
          D.push({ x: c.x - c.face * c.S * (0.1 + 0.4 * w.rnd()), y: c.y + c.S * 0.48, vx: -c.face * (1 + w.rnd() * 2),
                   vy: -0.4 - w.rnd() * 0.8, age: 0, life: 0.8 + w.rnd() * 0.7 });
        }
      }
      for (q = D.length - 1; q >= 0; q--) {
        var d = D[q];
        d.age += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= Math.pow(0.4, dt);
        if (d.age > d.life) D.splice(q, 1);
      }
    },
    under: function (w, t, A, s) {
      var C = this.c0 + this.sc0, R = s.row, K = s.col, M = s.amp, BI = s.bi, BJ = s.bj, BH = s.bh, i, j, n, g;
      // il vento soffia verso destra: raffiche che vanno e vengono
      for (i = 0; i < w.cols; i++) { K[i] = i * 0.075 - t * 1.25; M[i] = 0.55 + 0.45 * Math.sin(i * 0.017 - t * 0.23); }

        i = BI[n]; j = BJ[n];

        // fili piegati dal vento: nella raffica si coricano e mostrano il verde chiaro
        var hgt = BH[n], hi = g > 0.45, lean = g > -0.35 ? 1 : 0;
        w.put(i, j, 0.15, C + (hgt === 1 ? 0 : 1), A * 0.7);
        if (hgt > 1) w.put(i + lean, j - 1, hi ? 0.3 : 0.2, C + (hi ? 2 : 1), A * 0.75);
        if (hgt > 2) w.put(i + lean + (g > 0.1 ? 1 : 0), j - (g > 0.6 ? 1 : 2), hi ? 0.3 : 0.18, C + (hi ? 2 : 1), A * 0.7);
      }
      for (n = 0; n < s.flowers.length; n++) {
        var f = s.flowers[n];
        g = Math.sin(K[f.x] + R[f.y]) * M[f.x];
        for (j = 0; j < f.h; j++) w.put(f.x, f.y - j, 0.2, C + 1, A * 0.7);
        w.put(f.x + (g > 0.4 ? 1 : 0), f.y - f.h, 0.55, C + f.c, A * 0.85);
      }
      drawCells(w, s.cells, C, A);
    },
    over: function (w, t, A, s) {
      var C = this.c0 + this.sc0, D = s.dust;
      for (var q = 0; q < D.length; q++) {
        var d = D[q], u = d.age / d.life;
        w.put(Math.floor(d.x), Math.floor(d.y), 0.08 + 0.3 * (1 - u), C + 8, A * 0.8 * (1 - u));
      }
    }
  };
  // ==== fine cavalli ====

  // ==== animale: anatre ====
  // Anatre: lo stagno visto dall'alto. In basso la riva (fango, erba e canne con le
  // pannocchie che ondeggiano); sull'acqua riflessi, ninfee che si scostano quando
  // un'anatra ci passa in mezzo, e la scia a V dietro ogni anatra.

  // (uno aperto, con i chicchi sparsi) e casse da aggirare, mucchietti di chicchi dove i
  // topi si fermano a rosicchiare, una ragnatela in un angolo. Il formaggio arrivato con
  // un clic si consuma a morsi e lascia le briciole.
  // un sacco: un cuscino di tela un po' bitorzoluto, con il collo legato da una parte
  function celleSacco(w, o, cells) {
    var R = o.r * 1.35;
    for (var j = Math.floor(o.y - R); j <= o.y + R; j++) {
      for (var i = Math.floor(o.x - R); i <= o.x + R; i++) {
        var dx = i + 0.5 - o.x, dy = j + 0.5 - o.y, a = Math.atan2(dy, dx);
        var ex = Math.abs(dx) / o.r, ey = Math.abs(dy) / (o.r * 0.85);
        var d = Math.pow(Math.pow(ex, 2.6) + Math.pow(ey, 2.6), 1 / 2.6) / (1 + 0.06 * Math.sin(4 * a + o.p));
        // il collo legato
        var nx = dx - Math.cos(o.a) * o.r * 1.05, ny = dy - Math.sin(o.a) * o.r * 1.05;
        if (nx * nx + ny * ny < 1.3) { cells.push(i, j, 0.55, 5, 0.9); continue; }
        if (d >= 1) continue;
        var trama = (i + j) % 2 === 0 && hash2(i * 5, j * 3) < 0.6;
        cells.push(i, j, 0.3 + 0.2 * (1 - d * d) + (dx + dy < 0 ? 0.08 : 0), trama || d > 0.88 ? 4 : 3, 0.85);
      }
    }
  }
  // una cassa di legno: assi, il bordo più scuro
  function celleCassa(w, o, cells) {
    var h = o.r;
    for (var j = Math.floor(o.y - h); j < o.y + h; j++) {
      for (var i = Math.floor(o.x - h); i < o.x + h; i++) {
        var dx = Math.abs(i + 0.5 - o.x), dy = Math.abs(j + 0.5 - o.y);
        if (dx > h - 1 || dy > h - 1) cells.push(i, j, 0.5, 7, 0.9);
        else if (Math.abs(dx - dy) < 0.6) cells.push(i, j, 0.42, 7, 0.85); // la croce sul coperchio
        else cells.push(i, j, (j % 3 === 0 ? 0.22 : 0.34) + 0.06 * hash2(i, j), 6, 0.85);
      }
    }
  }
  SCENES.topi = {
    // 0 pietra, 1 pietra chiara, 2 malta, 3-4 tela dei sacchi, 5 spago, 6-7 cassa, 8-9 chicchi,
    // 10 formaggio, 11 crosta, 12 buchi del formaggio, 13 ragnatela, 14 briciole
    pal: ['#3f434c', '#5c616d', '#25272d', '#b39062', '#80653f', '#ddd0a8', '#8a6238', '#5a3e24',
          '#e6c45c', '#b8923a', '#ffd84a', '#f0a62c', '#c98e1e', '#8d93a0', '#ead79c'],
    tondi: [12], // i buchi del formaggio: sempre "o"
    init: function (w) {
      var s = { pav: [], celle: [], sacchi: [], ostacoli: [], chicchi: [], formaggi: [], briciole: [] }, i, j, k, n;
      // lastre di pietra: la malta dove due lastre si toccano (celle di Voronoi su una griglia mossa)
      var LX = 11, LY = 7;
      function punto(gi, gj) { return [(gi + 0.15 + 0.7 * hash2(gi * 7 + 1, gj * 3 + 5)) * LX, (gj + 0.15 + 0.7 * hash2(gi * 11 + 2, gj * 13 + 9)) * LY]; }
      for (j = 0; j < w.rows; j++) {
        for (i = 0; i < w.cols; i++) {
          var gi = Math.floor((i + 0.5) / LX), gj = Math.floor((j + 0.5) / LY), d1 = 1e9, d2 = 1e9;
          for (var b = -1; b <= 1; b++) {
            for (var a = -1; a <= 1; a++) {
              var p = punto(gi + a, gj + b), dx = (i + 0.5 - p[0]) / LX, dy = (j + 0.5 - p[1]) / LY, d = dx * dx + dy * dy;
              if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
            }
          }
          var h = hash2(i * 3 + 7, j * 5 + 1), bordo = Math.sqrt(d2) - Math.sqrt(d1);
          if (bordo < 0.05) { if (h < 0.75) s.pav.push(i, j, 0.12 + 0.06 * h, 2, 0.75); }
          else if (h < 0.035) s.pav.push(i, j, 0.08 + h * 2, h < 0.012 ? 1 : 0, 0.6);
        }
      }
      // sacchi e casse, da aggirare
      n = clamp(Math.round(w.cols * w.rows / 2600), 3, 7);
      for (k = 0; k < n; k++) {
        var r = 3 + w.rnd() * 1.8, pp = place(w, r + 1, s.ostacoli, 4), cassa = k % 3 === 2;
        var o = { x: pp.x, y: pp.y, r: cassa ? r * 1.1 : r, a: w.rnd() * TAU, p: w.rnd() * TAU, cassa: cassa };
        s.ostacoli.push(o);
        if (cassa) celleCassa(w, o, s.celle); else celleSacco(w, o, s.celle);
      }
      // mucchietti di chicchi (dove i topi si fermano a rosicchiare); il primo sacco è
      // aperto e ne lascia una scia
      n = clamp(Math.round(w.cols * w.rows / 1700), 4, 11);
      for (k = 0; k < n; k++) {
        var cp;
        if (k < 3 && s.ostacoli.length && !s.ostacoli[0].cassa) {
          var o0 = s.ostacoli[0], aa = o0.a + (k - 1) * 0.35, rr = o0.r * 1.45 + k * 1.8;
          cp = { x: o0.x + Math.cos(o0.a) * rr + Math.cos(aa) * 0.5, y: o0.y + Math.sin(o0.a) * rr + Math.sin(aa) * 0.5 };
        } else cp = place(w, 2, s.ostacoli.concat(s.chicchi), 3);
        if (cp.x < 2 || cp.y < 2 || cp.x > w.cols - 2 || cp.y > w.rows - 2) continue;
        s.chicchi.push({ x: cp.x, y: cp.y, r: 1.5, taken: null });
        for (var g = 0; g < 9; g++) {
          var ga = w.rnd() * TAU, gr = w.rnd() * 1.8;
          s.celle.push(Math.floor(cp.x + Math.cos(ga) * gr), Math.floor(cp.y + Math.sin(ga) * gr * 0.8), 0.4 + 0.3 * w.rnd(), w.rnd() < 0.3 ? 9 : 8, 0.9);
        }
      }
      // la ragnatela in un angolo in alto
      var sx = w.rnd() < 0.5 ? 0 : w.cols, dir = sx ? -1 : 1, L = Math.min(14, w.rows * 0.3);
      for (k = 0; k < 6; k++) {
        var an = (k + 0.5) / 6 * Math.PI / 2;
        for (var e = 1; e < L; e += 0.8) s.pav.push(Math.floor(sx + dir * Math.cos(an) * e), Math.floor(Math.sin(an) * e), 0.12, 13, 0.6);
      }
      for (var giro = 3; giro < L; giro += 2.6) {
        for (var q = 0; q <= 14; q++) {
          var an2 = q / 14 * Math.PI / 2, rg = giro * (0.92 + 0.08 * Math.cos(an2 * 12));
          s.pav.push(Math.floor(sx + dir * Math.cos(an2) * rg), Math.floor(Math.sin(an2) * rg), 0.1, 13, 0.5);
        }
      }
      return s;
    },
    tick: function (w, dt, t, s) {
      // di ritorno dopo un altro sfondo: niente formaggio di allora
      if (s.ultimo !== undefined && t - s.ultimo > 1) {
        s.formaggi = s.formaggi.filter(function (f) { return f.nato >= s.ultimo; });
        s.briciole.length = 0;
      }
      s.ultimo = t;
      for (var k = s.formaggi.length - 1; k >= 0; k--) if (s.formaggi[k].q <= 0.04) s.formaggi.splice(k, 1);
      for (k = s.briciole.length - 1; k >= 0; k--) if ((s.briciole[k].age += dt) > 12) s.briciole.splice(k, 1);
      if (s.briciole.length > 150) s.briciole.splice(0, s.briciole.length - 150);
    },
    under: function (w, t, A, s) {
      var C = this.c0 + this.sc0, k;
      drawCells(w, s.pav, C, A);
      drawCells(w, s.celle, C, A);
      for (k = 0; k < s.briciole.length; k++) {
        var b = s.briciole[k];
        w.put(Math.floor(b.x), Math.floor(b.y), 0.35, C + 14, A * 0.8 * Math.min(1, (12 - b.age) / 3));
      }
      // formaggio: uno spicchio visto dall'alto, con i buchi; i morsi lo rimpiccioliscono e lo
      // rosicchiano dal bordo
      for (k = 0; k < s.formaggi.length; k++) {
        var f = s.formaggi[k], R = f.r * (0.45 + 0.55 * Math.sqrt(f.q)), cx = Math.cos(f.rot), cy = Math.sin(f.rot);
        var ax = f.x - cx * R * 0.55, ay = f.y - cy * R * 0.55, fa = A * Math.min(1, (w.t - f.nato) * 4);
        for (var j = Math.floor(f.y - R - 1); j <= f.y + R + 1; j++) {
          for (var i = Math.floor(f.x - R - 1); i <= f.x + R + 1; i++) {
            var dx = i + 0.5 - ax, dy = j + 0.5 - ay, d = Math.sqrt(dx * dx + dy * dy);
            if (d >= R || Math.abs(angDiff(Math.atan2(dy, dx), f.rot)) > 0.55) continue;
            if (d > R * 0.45 && hash2(i * 7 + f.seme, j * 3 - f.seme) > 0.3 + 0.8 * f.q) continue; // i morsi

    },
    spots: function (w, s) { return s.chicchi; },
    obstacles: function (w, s) { return s.ostacoli; }
  };
  // ==== fine topi ====

  /* ------------------------------------------------------------------ */
  /* Paesaggi: sfondi senza animali, gli stessi dello screensaver         */
  /* (dreams/), nel menu "Sfondo > Paesaggi" dopo gli animali. Sono       */
  /* scritti come le scene dell'utente, scena({ colori, init, tick,       */
  /* disegna }), così l'app li copia in scene/di-serie (tra le righe      */
  /* "====") e si possono cambiare come gli animali; id e nome qui        */
  /* servono solo alla pagina (per un file contano il nome del file e la  */
  /* riga "// nome:").                                                    */
  /* ------------------------------------------------------------------ */
  var COLORE = /^#[0-9a-f]{6}$/i;
  function niente() {}
  // una scena senza animali, da scena({...}): un animale che non nasce mai
  function daScena(def) {
    var pal = (Array.isArray(def.colori) ? def.colori : []).filter(function (c) { return COLORE.test(c); }).slice(0, 16);
    if (!pal.length) pal = ['#aab3c5'];
    var sp = {
      dot: COLORE.test(def.puntino) ? def.puntino : pal[0], pal: pal,
      dens: 1e9, min: 0, max: 0, smin: 4, smax: 8, off: 0, rad: 1,
      spawn: niente, update: niente, shape: niente, paesaggio: true,
      init: def.init, tick: def.tick, under: def.disegna || niente
    };
    if (typeof def.sopra === 'function') sp.over = def.sopra;
    // colori con un carattere fisso: tondi = sempre 'o', fiocchi = '*' (o '.' se tenui)
    if (Array.isArray(def.tondi)) sp.tondi = def.tondi.slice(0, 16);
    if (Array.isArray(def.fiocchi)) sp.fiocchi = def.fiocchi.slice(0, 16);
    if (typeof def.clicTesto === 'string') sp.clicTesto = def.clicTesto.slice(0, 60);
    // altre funzioni della scena (es. una che crea una goccia): si chiamano con this.nome()
    for (var k in def) {
      if (typeof def[k] === 'function' && !(k in sp) && k !== 'disegna' && k !== 'sopra') sp[k] = def[k];
    }
    return sp;
  }
  function scena(def) {
    var sp = daScena(def);
    sp.id = def.id;
    sp.label = def.nome;
    SPECIES.push(sp);
  }

  // ==== paesaggio: stelle ====
  // Stelle: si vola tra le stelle, che arrivano dal centro, crescono e lasciano una scia;
  // ogni tanto una stella cadente. (Lo stesso paesaggio dello screensaver, dreams/.)
  scena({
    id: 'stelle', nome: 'Stelle',
    colori: ['#dce6ff', '#b4c8ff', '#ffecc8', '#ffd2aa', '#7896ff', '#ffffff'],
    puntino: '#b4c8ff',
    init: function (w) {
      var s = { stelle: [], cadente: null };
      var n = clamp(Math.round(w.cols * w.rows / 16), 60, 900);
      for (var k = 0; k < n; k++) s.stelle.push(this.stella(w, 0.05 + 0.95 * w.rnd()));
      return s;
    },
    stella: function (w, z) {
      return { x: w.rnd() * 2 - 1, y: w.rnd() * 2 - 1, z: z, c: w.rnd() < 0.8 ? Math.floor(w.rnd() * 2) : 2 + Math.floor(w.rnd() * 2) };
    },
    tick: function (w, dt, t, s) {
      var vel = 0.05 * (1 + 0.4 * Math.sin(t * 0.07));
      s.vel = vel;
      for (var k = 0; k < s.stelle.length; k++) {
        var st = s.stelle[k];
        st.z -= vel * dt;
        if (st.z <= 0.03) s.stelle[k] = this.stella(w, 1);
      }
      if (!s.cadente && w.rnd() < dt / 12) {
        var sx = w.rnd() < 0.5;
        s.cadente = { x: (sx ? 0 : 0.5) * w.cols + w.rnd() * w.cols * 0.5, y: w.rnd() * w.rows * 0.3,
                      vx: (sx ? 1 : -1) * w.cols * 0.5, vy: w.rows * 0.3, vita: 1.3 };
      }
      if (s.cadente) {
        var c = s.cadente;
        c.x += c.vx * dt; c.y += c.vy * dt; c.vita -= dt;
        if (c.vita <= 0) s.cadente = null;
      }
    },
    disegna: function (w, t, A, s) {
      var C = this.c0, cx = w.cols / 2, cy = w.rows / 2, sc = Math.max(w.cols, w.rows) * 0.3;
      var ang = t * 0.012, sa = Math.sin(ang), ca = Math.cos(ang), vel = s.vel || 0.05;
      for (var k = 0; k < s.stelle.length; k++) {
        var st = s.stelle[k], z = Math.max(0.03, st.z);
        var rx = st.x * ca - st.y * sa, ry = st.x * sa + st.y * ca;
        var x = cx + rx / z * sc, y = cy + ry / z * sc;
        if (x < 0 || y < 0 || x >= w.cols || y >= w.rows) { s.stelle[k] = this.stella(w, 1); continue; }
        var vicino = 1 - z, luce = Math.max(0.35, Math.pow(vicino, 1.1));
        // pochi gradini di luminosità: le celle cambiano meno spesso
        var v = z > 0.7 ? 0.3 : z > 0.45 ? 0.55 : z > 0.22 ? 0.8 : 1;
        if (z < 0.4) {

          var z2 = z + vel * 0.6, px = cx + rx / z2 * sc, py = cy + ry / z2 * sc;
          var passi = Math.min(8, Math.ceil(Math.max(Math.abs(x - px), Math.abs(y - py))));
          for (var p = 1; p <= passi; p++) {
            var f = p / (passi + 1);
            w.put(Math.floor(px + (x - px) * f), Math.floor(py + (y - py) * f), 0.2, C + 4, A * luce * f * 0.8);
          }
        }
        w.put(Math.floor(x), Math.floor(y), v, C + st.c, A * Math.round(luce * 4) / 4);
      }
      if (s.cadente) {
        var c = s.cadente, l = Math.min(1, c.vita);
        for (var q = 0; q < 10; q++) {
          var g = q / 10;
          w.put(Math.floor(c.x - c.vx * g * 0.1), Math.floor(c.y - c.vy * g * 0.1), q ? 0.5 - g * 0.4 : 0.9, C + (q ? 4 : 5), A * l * (1 - g));
        }

  });
  // ==== fine stelle ====

  // ==== paesaggio: pioggia ====
  // Pioggia e lampi: gocce col vento, schizzi e cerchi nelle pozzanghere, ogni tanto un
  // fulmine che illumina tutto.
  scena({
    id: 'pioggia', nome: 'Pioggia e lampi',
    colori: ['#96b9eb', '#506e96', '#3c5578', '#bec8ff', '#f0f4ff', '#6f8fbf'],
    puntino: '#96b9eb',
    init: function (w) {
      var s = { gocce: [], cerchi: [], fulmine: null, lampo: 0, prossimo: 6 + 8 * w.rnd() };
      var n = clamp(Math.round(w.cols * w.rows / 34), 30, 600);
      for (var k = 0; k < n; k++) {
        var v = 0.9 + 0.5 * w.rnd();
        s.gocce.push({ x: w.rnd() * w.cols, y: w.rnd() * w.rows, v: v, lungo: v > 1.2 ? 3 : 2 });
      }
      return s;
    },
    fulmine: function (w, terra) {
      var punti = [], x = Math.floor(w.cols * (0.15 + 0.7 * w.rnd())), rami = [];
      for (var y = 0; y < terra; y++) {
        x += Math.floor(w.rnd() * 3) - 1;
        punti.push(x, y);
        if (w.rnd() < 0.06 && y < terra - 4) rami.push(x, y, w.rnd() < 0.5 ? -1 : 1);
      }
      for (var r = 0; r < rami.length; r += 3) {
        var rx = rami[r], lungo = 3 + Math.floor(w.rnd() * 6);
        for (var yy = rami[r + 1] + 1; yy < Math.min(terra, rami[r + 1] + lungo); yy++) { rx += rami[r + 2]; punti.push(rx, yy); }
      }
      return { punti: punti, vita: 0.45 };
    },
    tick: function (w, dt, t, s) {
      var terra = Math.floor(w.rows * 0.86), caduta = w.rows * 0.8;
      s.vento = Math.sin(t * 0.05) * 0.35 + Math.sin(t * 0.31) * 0.08;
      s.lampo = Math.max(0, s.lampo - dt * 2.2);
      for (var k = 0; k < s.gocce.length; k++) {
        var g = s.gocce[k];
        g.y += caduta * g.v * dt;
        g.x += s.vento * caduta * g.v * dt * 0.5;
        if (g.y >= terra) {
          if (s.cerchi.length < 100 && w.rnd() < 0.2) s.cerchi.push({ x: Math.floor(g.x), eta: 0 });
          g.y = -w.rnd() * w.rows * 0.3;
          g.x = w.cols * (w.rnd() * 1.4 - 0.2);
        }
      }
      for (var c = s.cerchi.length - 1; c >= 0; c--) { s.cerchi[c].eta += dt; if (s.cerchi[c].eta > 0.9) s.cerchi.splice(c, 1); }
      s.prossimo -= dt;
      if (s.prossimo <= 0) { s.fulmine = this.fulmine(w, terra); s.lampo = 1; s.prossimo = 9 + 16 * w.rnd(); }
      if (s.fulmine) { s.fulmine.vita -= dt; if (s.fulmine.vita <= 0) s.fulmine = null; }
    },
    disegna: function (w, t, A, s) {
      var C = this.c0, terra = Math.floor(w.rows * 0.86), x, y, k;
      // il lampo: lo schermo si illumina di puntini
      if (s.lampo > 0.05) {
        var la = A * Math.round(s.lampo * 4) / 4 * 0.35;
        for (y = 0; y < terra; y += 2) for (x = (y * 3) % 5; x < w.cols; x += 5) w.put(x, y, 0.1, C + 3, la);
      }
      var luce = A * (0.75 + s.lampo * 0.25);
      for (k = 0; k < s.gocce.length; k++) {
        var g = s.gocce[k];
        for (var q = 0; q < g.lungo; q++) {
          var f = 1 - q / (g.lungo + 0.5);
          w.put(Math.floor(g.x - s.vento * q * 0.5), Math.floor(g.y) - q, q ? 0.3 : 0.6, C, Math.min(1, luce * f * (g.v - 0.1)));
        }
      }
      // la superficie dell'acqua e il terreno bagnato

      for (x = 0; x < w.cols; x++) {
        var n = rumore(x * 0.15, t * 0.6);
        w.put(x, terra, n > 0.62 ? 0.55 : n > 0.4 ? 0.35 : 0.2, C + 1, chiaro);
        for (y = terra + 1; y < w.rows; y++) {
          var d = (y - terra) / (w.rows - terra);
          if (rumore(x * 0.4, y * 1.3 + Math.floor(t * 2) * 0.2) > 0.55 + d * 0.2) w.put(x, y, 0.15, C + 2, A * 0.5);
        }
      }
      // schizzi e cerchi
      for (k = 0; k < s.cerchi.length; k++) {
        var c = s.cerchi[k];
        if (c.eta < 0.12) {
          w.put(c.x, terra - 1, 0.6, C, A * 0.8);
          w.put(c.x - 1, terra - 2, 0.2, C, A * 0.5);
          w.put(c.x + 1, terra - 2, 0.2, C, A * 0.5);
        } else {

          w.put(c.x + r + 1, terra, 0.4, C + 5, fa, true);

      // il fulmine tremola: acceso, spento, acceso
      var fu = s.fulmine;
      if (fu && (fu.vita > 0.3 || (fu.vita > 0.12 && fu.vita < 0.22))) {
        for (k = 0; k < fu.punti.length; k += 2) w.put(fu.punti[k], fu.punti[k + 1], 0.95, C + 4, A, true);
      }
    }
  });
  // ==== fine pioggia ====

  // ==== paesaggio: fuoco ====
  // Falò: il fuoco a propagazione di calore, con le braci che salgono, la legna e i sassi.
  scena({
    id: 'fuoco', nome: 'Falò',
    colori: ['#3c0804', '#aa1e08', '#eb5a14', '#ffa028', '#ffe178', '#fffaeb', '#ff9632', '#784623', '#c8642a', '#6e6e78'],
    puntino: '#ffa028',
    init: function (w) {
      var W = w.cols, H = w.rows;
      return { calore: new Float32Array(W * (H + 2)), braci: [], resto: 0 };
    },
    // un passo della simulazione, a ritmo fisso (30 al secondo)
    simula: function (w, s, t) {
      var W = w.cols, H = w.rows, cal = s.calore, base = Math.floor(H * 0.88), centro = W / 2;
      var largo = Math.max(6, W * 0.15), x, y;
      for (y = base; y < base + 2; y++) {
        for (x = 0; x < W; x++) {
          var d = Math.abs((x - centro) / largo), forza = Math.max(0, 1 - d * d);
          cal[y * W + x] = w.rnd() < 0.7 ? Math.min(1, forza * (0.7 + 0.6 * rumore(x * 0.35, t * 3))) : 0;
        }
      }
      var raffredda = 2.6 / H, vento = (rumore(t * 0.3, 7) - 0.5) * 1.5;
      for (y = 0; y < base; y++) {
        for (x = 0; x < W; x++) {
          var sx = Math.round(x + vento * w.rnd());
          var a = clamp(sx - 1, 0, W - 1), b = clamp(sx, 0, W - 1), c = clamp(sx + 1, 0, W - 1);
          var r1 = (y + 1) * W, r2 = Math.min(H + 1, y + 2) * W;
          var v = (cal[r1 + a] + cal[r1 + b] + cal[r1 + c] + cal[r2 + b]) / 4 - raffredda * (0.6 + w.rnd() * 0.8);
          cal[y * W + x] = v > 0 ? v : 0;
        }
      }
      if (w.rnd() < 0.3 && s.braci.length < 60) {
        s.braci.push({ x: centro + (w.rnd() - 0.5) * largo * 1.2, y: base * 0.75, vx: (w.rnd() - 0.5) * 6, vita: 1.5 + 2.5 * w.rnd() });
      }
    },
    tick: function (w, dt, t, s) {
      s.resto = Math.min(s.resto + dt, 4 / 30);
      while (s.resto >= 1 / 30) { this.simula(w, s, t); s.resto -= 1 / 30; }
      for (var k = s.braci.length - 1; k >= 0; k--) {
        var b = s.braci[k];
        b.y -= 6 * dt; b.x += (b.vx + Math.sin(t * 2 + b.y * 0.3) * 2) * dt; b.vita -= dt;
        if (b.vita <= 0 || b.y < 0) s.braci.splice(k, 1);
      }
    },
    disegna: function (w, t, A, s) {
      var C = this.c0, W = w.cols, H = w.rows, base = Math.floor(H * 0.88), cal = s.calore, x, y;
      for (y = 0; y < base; y++) {
        for (x = 0; x < W; x++) {
          var v = cal[y * W + x];
          if (v <= 0.05) continue;
          // sei colori dal rosso scuro al bianco; la luce a gradini
          w.put(x, y, Math.round(Math.pow(v, 0.8) * 8) / 8, C + Math.min(5, Math.floor(v * 6)), A * Math.min(1, Math.round(v * 1.6 * 4) / 4 + 0.25));
        }
      }
      for (var k = 0; k < s.braci.length; k++) {
        var b = s.braci[k], f = Math.min(1, b.vita / 2);
        w.put(Math.floor(b.x), Math.floor(b.y), f > 0.6 ? 0.7 : 0.3, C + 6, A * f);
      }
      // la legna: tronchi incrociati, accesi dalle braci
      var centro = Math.floor(W / 2), largo = Math.floor(W * 0.11);
      for (var i = 0; i < 4 && base + i < H; i++) {
        y = base + i;
        for (x = centro - largo + i * 2; x < centro + largo - i * 2; x++) {
          var acceso = cal[base * W + clamp(x, 0, W - 1)];
          w.put(x, y, (x + y) % 7 === 0 ? 0.45 : i === 0 ? 0.3 : 0.8, acceso > 0.5 ? C + 8 : C + 7, A * (0.6 + acceso * 0.4), true);
        }
      }
      // i sassi intorno
      var sassi = [centro - largo - 3, centro - largo - 1, centro + largo, centro + largo + 2];
      for (var q = 0; q < sassi.length; q++) {
        y = base + 2 + (q % 2);
        w.put(sassi[q], y, 0.6, C + 9, A * 0.7);
        w.put(sassi[q] + 1, y, 0.6, C + 9, A * 0.7);
      }
    }
  });
  // ==== fine fuoco ====

  // ==== paesaggio: aurora ====
  // Aurora: tende di luce verde e viola che ondeggiano sopra le montagne, stelle che
  // brillano e un lago che riflette tutto.
  scena({
    id: 'aurora', nome: 'Aurora',
    colori: ['#46ff96', '#28dcbe', '#5a8cff', '#be5ae6', '#c8d2ff', '#788cb4', '#d2dcf0', '#2a3248', '#3c5078'],
    puntino: '#46ff96',
    init: function (w) {
      var s = { stelle: [], creste: [] };
      var n = Math.round(w.cols * w.rows / 50), x;
      for (var k = 0; k < n; k++) s.stelle.push(Math.floor(w.rnd() * w.cols), Math.floor(w.rnd() * w.rows * 0.55), w.rnd() * TAU, 0.5 + 2 * w.rnd());
      // il profilo delle montagne (fisso)
      var lago = Math.floor(w.rows * 0.78);
      for (x = 0; x < w.cols; x++) s.creste.push(Math.min(lago - 1, Math.floor(w.rows * 0.58 + (frattale(x * 0.035, 11, 4) - 0.5) * w.rows * 0.36)));
      return s;
    },
    disegna: function (w, t, A, s) {
      var C = this.c0, W = w.cols, H = w.rows, lago = Math.floor(H * 0.78), x, y, k;
      for (k = 0; k < s.stelle.length; k += 4) {
        if (s.stelle[k + 1] >= s.creste[s.stelle[k]]) continue;
        var l = 0.5 + 0.5 * Math.sin(t * s.stelle[k + 3] + s.stelle[k + 2]);
        w.put(s.stelle[k], s.stelle[k + 1], l > 0.6 ? 0.35 : 0.12, C + 4, A * (l > 0.6 ? 0.6 : 0.35));
      }
      // le tende: per ogni colonna un bordo in basso che ondeggia e una luce che sale;
      // il cielo acceso si ricorda per il riflesso nel lago
      var cielo = s.cielo && s.cielo.length === W * H ? s.cielo : (s.cielo = new Float32Array(W * H));
      cielo.fill(0);
      var tt = Math.floor(t * 6) / 6; // le tende si muovono a scatti piccoli: meno celle da ridisegnare
      for (x = 0; x < W; x++) {
        var forza = clamp((frattale(x * 0.018 + tt * 0.025, tt * 0.04, 3) - 0.3) * 2.8, 0, 1);
        if (forza <= 0) continue;
        var bordo = H * 0.4 + (frattale(x * 0.012, tt * 0.05 + 3, 3) - 0.5) * H * 0.3;
        var lungo = H * (0.16 + 0.26 * forza), raggio = 0.55 + 0.45 * rumore(x * 0.45, tt * 0.8);
        var tinta = rumore(x * 0.05, tt * 0.1) * 0.15;
        for (k = 0; k < lungo; k++) {
          y = Math.floor(bordo) - k;
          if (y < 0 || y >= s.creste[x]) continue;
          var f = 1 - k / lungo, luce = forza * Math.pow(f, 1.3) * raggio;
          if (luce < 0.06) continue;
          luce = Math.round(luce * 6) / 6;
          var col = Math.min(3, Math.floor(((1 - f) * 0.9 + tinta) * 4));
          w.put(x, y, luce, C + col, A * Math.min(1, luce * 2));
          cielo[y * W + x] = luce + col * 2; // luce (0..1) + colore, per il riflesso
        }
      }
      // le montagne: la cresta, un po' di neve sulle cime più alte, il fianco scuro
      for (x = 0; x < W; x++) {
        var cima = s.creste[x], prima = s.creste[Math.max(0, x - 1)], dopo = s.creste[Math.min(W - 1, x + 1)];
        w.put(x, cima, prima > cima && dopo > cima ? 0.7 : 0.5, C + 5, A * 0.7);
        if (cima < H * 0.45) w.put(x, cima + 1, 0.35, C + 6, A * 0.5);
        for (y = cima + 2; y < lago; y += 2) if (hash2(x, y) < 0.35) w.put(x, y, 0.2, C + 7, A * 0.8);
      }
      // il lago riflette il cielo capovolto, increspato
      for (y = lago; y < H; y++) {
        var src = lago - 1 - (y - lago);
        for (x = 0; x < W; x++) {
          var sx = Math.floor(x + (rumore(x * 0.2, y * 0.9 + tt * 0.7) - 0.5) * 3);
          var c = src >= 0 && sx >= 0 && sx < W ? cielo[src * W + sx] : 0;
          if (c > 0.06) {
            var cc = Math.floor(c / 2), lu = c - cc * 2;
            w.put(x, y, lu * 0.6, C + cc, A * Math.min(1, lu * 0.9));
          } else if (rumore(x * 0.3, y * 1.7 + tt * 0.5) > 0.72) {
            w.put(x, y, 0.15, C + 8, A * 0.4);
          }
        }
      }
    }
  });
  // ==== fine aurora ====

  // ==== paesaggio: vita ====
  // Gioco della vita: le cellule di Conway cambiano colore invecchiando e lasciano una scia
  // quando muoiono; se il mondo si ferma, arriva una pioggia di cellule nuove.
  scena({
    id: 'vita', nome: 'Gioco della vita',
    colori: ['#78ffe6', '#5adc78', '#e6e65a', '#ff8c50', '#e65ac8', '#5a78a0'],
    puntino: '#5adc78',
    init: function (w) {
      var n = w.cols * w.rows, s = { viva: new Uint8Array(n), eta: new Uint16Array(n), scia: new Float32Array(n),
                                     resto: 0, storia: [], semina: 25 };
      for (var i = 0; i < n; i++) s.viva[i] = w.rnd() < 0.18 ? 1 : 0;
      return s;
    },
    // una macchia di cellule a caso in un punto a caso
    semina: function (w, s) {
      var W = w.cols, H = w.rows, r = Math.max(3, Math.floor(H / 6)), cx = Math.floor(w.rnd() * W), cy = Math.floor(w.rnd() * H);
      for (var dy = -r; dy <= r; dy++) {
        for (var dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > r * r || w.rnd() >= 0.4) continue;
          var i = ((cy + dy + H) % H) * W + (cx + dx + W) % W;
          if (!s.viva[i]) { s.viva[i] = 1; s.eta[i] = 0; }
        }
      }
    },
    generazione: function (w, s) {
      var W = w.cols, H = w.rows, viva = s.viva, nuova = new Uint8Array(W * H), quante = 0;
      for (var y = 0; y < H; y++) {
        var su = ((y + H - 1) % H) * W, qui = y * W, giu = ((y + 1) % H) * W;
        for (var x = 0; x < W; x++) {
          var sx = (x + W - 1) % W, dx = (x + 1) % W;
          var n = viva[su + sx] + viva[su + x] + viva[su + dx] + viva[qui + sx] + viva[qui + dx] + viva[giu + sx] + viva[giu + x] + viva[giu + dx];
          nuova[qui + x] = n === 3 || (n === 2 && viva[qui + x]) ? 1 : 0;
        }
      }
      for (var i = 0; i < W * H; i++) {
        if (nuova[i]) { quante++; s.eta[i] = viva[i] ? Math.min(65535, s.eta[i] + 1) : 0; }
        else if (viva[i]) s.scia[i] = 1;
      }
      s.viva = nuova;
      s.storia.push(quante);
      if (s.storia.length > 40) s.storia.shift();
      var fermo = s.storia.length === 40 && s.storia.every(function (q) { return Math.abs(q - quante) <= 6; });
      if (fermo || quante < W * H / 60) { this.semina(w, s); s.storia.length = 0; }
    },
    tick: function (w, dt, t, s) {
      s.resto = Math.min(s.resto + dt, 0.5);
      while (s.resto >= 1 / 8) { this.generazione(w, s); s.resto -= 1 / 8; }
      s.semina -= dt;
      if (s.semina <= 0) { this.semina(w, s); s.semina = 15 + 20 * w.rnd(); }
      for (var i = 0; i < s.scia.length; i++) if (s.scia[i] > 0) s.scia[i] = Math.max(0, s.scia[i] - dt * 0.8);
    },
    disegna: function (w, t, A, s) {
      var C = this.c0, W = w.cols, H = w.rows;
      for (var y = 0; y < H; y++) {
        for (var x = 0; x < W; x++) {
          var i = y * W + x;
          if (s.viva[i]) {
            var e = s.eta[i];
            w.put(x, y, e < 2 ? 0.45 : e < 20 ? 0.7 : 0.9, C + Math.min(4, Math.floor(e / 12)), A * 0.9);
          } else if (s.scia[i] > 0.05) {
            w.put(x, y, 0.1, C + 5, A * Math.ceil(s.scia[i] * 3) / 3 * 0.4);
          }
        }
      }
    }
  });
  // ==== fine vita ====

  // ==== paesaggio: mare ====
  // Mare di notte: la luna con i crateri, nuvole che le passano davanti, il riflesso che
  // tremola sulle onde e una barchetta a vela che attraversa.
  scena({
    id: 'mare', nome: 'Mare di notte',
    colori: ['#c8d2ff', '#787d96', '#fffae1', '#c8c4aa', '#fff0be', '#4678aa', '#325a8c', '#5a6e96', '#aa9678'],
    puntino: '#fffae1',
    init: function (w) {
      var s = { stelle: [], barca: w.cols * (w.rnd() * 0.5) - 10 };
      for (var k = 0; k < w.cols * w.rows / 70; k++) s.stelle.push(Math.floor(w.rnd() * w.cols), Math.floor(w.rnd() * w.rows * 0.5), w.rnd() * TAU);
      return s;
    },
    tick: function (w, dt, t, s) {
      s.barca += dt * 1.2;
      if (s.barca > w.cols + 12) s.barca = -12 - w.rnd() * w.cols * 0.5;
    },
    disegna: function (w, t, A, s) {
      var C = this.c0, W = w.cols, H = w.rows, oriz = Math.floor(H * 0.55), x, y, k;
      var lx = W * 0.72, ly = H * 0.22, r = Math.max(3, H * 0.1), tt = Math.floor(t * 8) / 8;
      for (k = 0; k < s.stelle.length; k += 3) {
        if (s.stelle[k + 1] >= oriz - 1) continue;
        var l = Math.sin(t * 1.3 + s.stelle[k + 2]) > 0 ? 0.45 : 0.25;
        w.put(s.stelle[k], s.stelle[k + 1], 0.12, C, A * l);
      }
      // nuvole lente (ricalcolate 8 volte al secondo); la luna resta davanti
      if (s.tNuvole !== tt || !s.nuvole || s.nuvole.length !== W * oriz) {
        s.tNuvole = tt;
        if (!s.nuvole || s.nuvole.length !== W * oriz) s.nuvole = new Float32Array(W * oriz);
        for (y = 0; y < oriz - 2; y++) for (x = 0; x < W; x++) s.nuvole[y * W + x] = frattale(x * 0.03 - tt * 0.04, y * 0.12, 4);
      }
      for (y = 0; y < oriz - 2; y++) {
        for (x = 0; x < W; x++) {
          var n = s.nuvole[y * W + x];
          if (n > 0.62) {
            var dens = Math.min(1, (n - 0.62) * 4);
            w.put(x, y, dens > 0.5 ? 0.4 : 0.15, C + 1, A * (dens > 0.5 ? 0.55 : 0.35));
          }
        }
      }
      // la luna: un disco con i crateri
      for (y = Math.floor(ly - r); y <= ly + r; y++) {
        for (x = Math.floor(lx - r); x <= lx + r; x++) {
          var d = Math.sqrt((x - lx) * (x - lx) + (y - ly) * (y - ly)) / r;
          if (d > 1) continue;
          var cratere = frattale(x * 0.35, y * 0.35, 3);
          w.put(x, y, cratere > 0.62 ? 0.55 : cratere > 0.5 ? 0.75 : 0.95, C + (cratere > 0.6 ? 3 : 2), A * (0.95 * (1 - Math.pow(d, 6)) + 0.05), true);
        }
      }
      // le onde, più grandi e più chiare man mano che si avvicinano, e il riflesso della luna
      for (y = oriz + 1; y < H; y++) {
        var dd = (y - oriz) / Math.max(1, H - oriz), freq = 0.5 - dd * 0.35, largo = r * (1 + dd * 2.5);
        for (x = 0; x < W; x++) {
          var dx = Math.abs(x - lx);
          if (dx < largo) {
            var trem = rumore(x * 0.6, y * 1.1 + tt * 2.2);
            if (trem > 0.42 + dx / largo * 0.4) { w.put(x, y, trem > 0.7 ? 0.7 : 0.4, C + 4, A * (trem > 0.7 ? 0.95 : 0.7)); continue; }
          }
          var v = Math.sin(x * freq + tt * (0.8 + dd) + y * 1.7) * 0.6 + (rumore(x * 0.08, y * 0.5 + tt * 0.3) - 0.5) * 1.2;
          if (v > 0.55) w.put(x, y, 0.35, C + 5, A * (0.35 + 0.35 * dd));
          else if (v > 0.2) w.put(x, y, 0.15, C + 6, A * (0.25 + 0.3 * dd));
        }
      }
      for (x = 0; x < W; x++) if (Math.abs(x - lx) > r * 1.2) w.put(x, oriz, 0.2, C + 7, A * 0.6);
      // la barchetta, scura contro il riflesso
      var barca = ['    |\\    ', '    | \\   ', '  __|__\\_ ', '  \\_____/ '];
      var by = oriz + Math.floor((H - oriz) * 0.3) - barca.length, dondolo = Math.round(Math.sin(t * 1.1) * 0.6);
      for (var i = 0; i < barca.length; i++) {
        for (var j = 0; j < barca[i].length; j++) {
          var ch = barca[i].charAt(j), bx = Math.floor(s.barca) + j, yy = by + i + (i >= 2 ? 0 : Math.min(0, dondolo));
          if (ch !== ' ') w.put(bx, yy, ch === '_' ? 0.45 : 0.75, C + 8, A * 0.9, true);
          else if (i >= 2 && j > 1 && j < 9) w.put(bx, yy, 0.05, C + 6, 0, true);
        }
      }
    }
  });
  // ==== fine mare ====

  // ==== paesaggio: neve ====
  // Neve: una notte d'inverno. Nevica a tre profondità con il vento che va e viene, sugli
  // abeti con la neve sui rami e su una baita con la finestra accesa e il fumo dal camino;
  // la luna e qualche stella. Un clic è una folata: i fiocchi intorno volano via e la neve
  // per terra si alza in uno sbuffo.
  scena({
    id: 'neve', nome: 'Neve',
    // 0 fiocchi vicini, 1 fiocchi lontani, 2 neve, 3 neve in ombra, 4-5 abeti, 6 legno,
    // 7 finestra accesa, 8 fumo, 9 luna, 10 stelle, 11 colline, 12 tetto, 13 tronchi
    colori: ['#f4f8ff', '#a3b5d8', '#dfe7f5', '#7f92b8', '#1f5847', '#2e7a5b', '#7a5638', '#ffcf73',
             '#8f99ab', '#f6efc8', '#c4d0f5', '#46567c', '#9c4a34', '#5a3f2b'],
    puntino: '#dfe7f5',
    fiocchi: [0, 1], // i fiocchi: '*' e '.'
    clicTesto: 'una folata di vento',
    init: function (w) {
      var W = w.cols, H = w.rows, s = { fissi: [], fiocchi: [], fumo: [], sbuffi: [], folate: [], vento: 0 };
      var i, j, k, terra = s.terra = new Float32Array(W + 1);
      for (i = 0; i <= W; i++) terra[i] = H * 0.8 + 1.5 * Math.sin(i * 0.07 + 1) + 1.1 * Math.sin(i * 0.19 + 2);
      var celle = s.fissi;
      // le stelle (brillano: vedi disegna) e la luna, con qualche macchia
      s.stelle = [];
      for (k = 0; k < W * H / 90; k++) s.stelle.push(Math.floor(w.rnd() * W), Math.floor(w.rnd() * H * 0.55), w.rnd() * TAU);
      var lx = W * (0.14 + 0.1 * w.rnd()), ly = H * 0.17, lr = Math.max(2.5, H * 0.075);
      s.luna = { x: lx, y: ly, r: lr };
      for (j = Math.floor(ly - lr); j <= ly + lr; j++) {
        for (i = Math.floor(lx - lr); i <= lx + lr; i++) {
          var dx = i + 0.5 - lx, dy = j + 0.5 - ly, d = Math.sqrt(dx * dx + dy * dy) / lr;
          if (d < 1) celle.push(i, j, frattale(i * 0.4, j * 0.4, 2) > 0.55 ? 0.62 : 0.8 - 0.15 * d, 9, 1);
        }
      }
      // le colline lontane, innevate
      s.collina = new Float32Array(W + 1);
      for (i = 0; i <= W; i++) s.collina[i] = H * 0.67 - H * 0.07 * (Math.sin(i * 0.035 + 2.2) + 1) - H * 0.08 * frattale(i * 0.03 + 4.1, 2.3, 3);
      for (i = 0; i < W; i++) {
        var c0 = Math.floor(s.collina[i]);
        for (j = c0; j < terra[i]; j++) {
          if (j === c0) celle.push(i, j, 0.34, 2, 0.7);
          else if (hash2(i * 3 + 1, j * 7) < 0.35) celle.push(i, j, 0.12, 11, 0.7);
        }
      }
      // gli abeti: lontani (piccoli, sulle colline) e vicini (sul prato); la baita in mezzo
      var bx = Math.floor(W * (0.52 + 0.16 * w.rnd())), bw = Math.max(16, Math.round(H * 0.27)), alberi = [];
      s.baita = { x: bx, w: bw };
      var n = Math.max(6, Math.round(W / 9));
      for (k = 0; k < n; k++) {
        var lontano = k < n * 0.55, ax = Math.floor(w.rnd() * W);
        if (!lontano && Math.abs(ax - bx - bw / 2) < bw * 0.9) continue;
        var base = lontano ? s.collina[ax] + 2 + w.rnd() * 3 : terra[ax] + 0.5;
        var alto = lontano ? H * (0.07 + 0.05 * w.rnd()) : H * (0.17 + 0.13 * w.rnd());
        alberi.push({ x: ax, base: base, h: Math.max(4, alto), lontano: lontano });
      }
      alberi.sort(function (a, b) { return a.base - b.base; });
      for (k = 0; k < alberi.length; k++) this.abete(alberi[k], celle);
      this.baitaCelle(w, s, celle);
