# Compila il programma per Windows, macOS e Linux (x86_64 e aarch64) a ogni push e pull
# request (si scaricano dagli artifact della run) e prova l'installazione su Linux, sia
# con il programma già compilato sia compilando dal sorgente.
# Con un tag "v*" (es. v0.2.0) pubblica nelle Releases quello che è stato compilato
# qui, con gli SHA256 e l'attestazione di provenienza di GitHub.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Lo sfondo incorporato è uguale a wallpaper/index.html
        run: cmp wallpaper/index.html app/assets/ascii-zoo-wallpaper.html

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Compila
        working-directory: app
        run: cargo build --release --locked

      # le statistiche per nerd lette davvero (la GPU dai contatori di sistema)
      - name: Prova - statistiche per nerd
        run: app/target/release/ascii-zoo.exe --statistiche

      # il menu dell'icona con il programma vero, clic e tasti simulati: le impostazioni lo
      # lasciano aperto, Esc, un clic fuori e le altre voci lo chiudono
      - name: Prova - il menu resta aperto sulle impostazioni
        # con un tag la prova (che simula clic sul desktop del runner) non deve fermare
        # l'exe, la firma e la Release: se fallisce resta il segno rosso del passo
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/windows-menu-test/menu-test.ps1 -Exe app/target/release/ascii-zoo.exe -Out menu-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-menu-windows
          path: menu-test/
          if-no-files-found: warn

      # scene tue: con la cartella delle scene l'app scrive un file per ogni sfondo di serie
      # in scene\di-serie, e un file della cartella (lucciole.js) diventa una voce del menu
      - name: Prova - scene tue
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          $dir = Join-Path $env:APPDATA 'AsciiZoo\scene'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item scene\lucciole.js $dir
          # lucciole (voce 18: dopo 11 animali e 6 paesaggi) e tema chiaro: a pagina caricata devono
          # esserci già, dalle impostazioni messe prima della pagina (script iniziale, ZOO_INIZIO)
          # avviso di aggiornamento: una versione 99.0.0 vista "ieri" mette la voce in cima al menu; il
          # controllo subito (ASCII_ZOO_AGGIORNAMENTI_SUBITO) chiede a GitHub con il curl di Windows,
          # trova l'ultima vera e la voce se ne va
          Set-Content (Join-Path $env:APPDATA 'AsciiZoo\config.json') '{"animale": 18, "animali_di_serie": 11, "tema": "chiaro", "clic_desktop": false, "versione_disponibile": "99.0.0"}'
          $env:ASCII_ZOO_LOG = '1'
          $env:ASCII_ZOO_AGGIORNAMENTI_SUBITO = '1'
          $p = Start-Process app\target\release\ascii-zoo.exe -PassThru -RedirectStandardError scene-win.log
          Start-Sleep 15
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          # anche i tempi dell'avvio (finestra e WebView, pagina caricata, primo fotogramma)
          Get-Content scene-win.log | Select-String 'scena|avvio|aggiornamenti'
          $file = @(Get-ChildItem (Join-Path $dir 'di-serie') -Filter *.js)
          "di-serie: $($file.Count) file: $($file.Name -join ', ')"
          # 11 animali e 6 paesaggi
          if ($file.Count -ne 17) { Write-Error "in di-serie ci sono $($file.Count) file invece di 17"; exit 1 }
          if (-not (Select-String -Path scene-win.log -Pattern 'scena lucciole: "Lucciole"' -Quiet)) { Write-Error "lucciole.js non letta"; exit 1 }
          if (-not (Select-String -Path scene-win.log -Pattern 'mostra lucciole, tema chiaro' -Quiet)) { Write-Error "a pagina caricata non ci sono già lucciole e tema chiaro (script iniziale)"; exit 1 }
          if (-not (Select-String -Path scene-win.log -SimpleMatch -Pattern 'nel menu la versione 99.0.0 (Ok(()))' -Quiet)) { Write-Error "la voce dell'aggiornamento non è nel menu"; exit 1 }
          if (Select-String -Path scene-win.log -Pattern 'controllo non riuscito' -Quiet) { Write-Warning "GitHub non ha risposto (rete o limite delle richieste)" }
          elseif (-not (Select-String -Path scene-win.log -SimpleMatch -Pattern 'voce tolta dal menu (Ok(()))' -Quiet)) { Write-Error "il controllo degli aggiornamenti non è finito (curl di Windows)"; exit 1 }
          Remove-Item -Recurse -Force $dir

      - name: Prova lo screensaver - un fotogramma per scena, senza finestra
        working-directory: dreams
        run: |
          cargo build --release --locked
          for s in stelle pioggia fuoco aurora vita mare; do
            ./target/release/ascii-dreams.exe --png "prova-$s.png" --scena "$s" --secondi 2
            test -s "prova-$s.png"
          done

      - name: SHA256
        run: |
          mkdir dist
          cp app/target/release/ascii-zoo.exe dist/
          cd dist
          sha256sum ascii-zoo.exe | tee ascii-zoo.exe.sha256

      - uses: actions/upload-artifact@v4
        id: non-firmato
        with:
          name: ascii-zoo-windows
          path: dist/
          if-no-files-found: error

      # Firma del codice, solo per i tag e solo quando SignPath è configurato
      # (variabile SIGNPATH_ORGANIZATION_ID e segreto SIGNPATH_API_TOKEN del repository).
      # Ogni firma va approvata a mano su SignPath: il job aspetta fino a un'ora.
      # L'exe firmato prende il posto di quello di prima e lo SHA256 si ricalcola.
      - name: Firma con SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ascii-zoo
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.non-firmato.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmato

      - name: SHA256 dell'exe firmato
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          cd firmato
          sha256sum ascii-zoo.exe | tee ascii-zoo.exe.sha256

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        with:
          name: ascii-zoo-windows
          path: firmato/
          overwrite: true
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Target Apple Silicon e Intel
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            dreams/macos

      - name: Compila
        working-directory: app
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # lo screensaver, "ASCII Zoo.saver": una libreria che macOS carica nel suo processo
      # dei salvaschermo (dreams/macos)
      - name: Compila lo screensaver
        working-directory: dreams/macos
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: App universale e DMG
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          app="build/ASCII Zoo.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/ascii-zoo" \
            app/target/aarch64-apple-darwin/release/ascii-zoo \
            app/target/x86_64-apple-darwin/release/ascii-zoo
          sed "s/@VERSION@/$version/g" app/macos/Info.plist > "$app/Contents/Info.plist"
          # il modulo dello screensaver, con la versione dell'app, dentro l'app: è lei che lo
          # installa in ~/Library/Screen Savers
          saver="build/ASCII Zoo.saver"
          mkdir -p "$saver/Contents/MacOS"
          lipo -create -output "$saver/Contents/MacOS/AsciiZoo" \
            dreams/macos/target/aarch64-apple-darwin/release/libascii_dreams_macos.dylib \
            dreams/macos/target/x86_64-apple-darwin/release/libascii_dreams_macos.dylib
          sed "s/@VERSION@/$version/g" dreams/macos/Info.plist > "$saver/Contents/Info.plist"
          # la miniatura nella lista dei salvaschermo: un pezzo dell'aurora (90×58 punti)
          mkdir -p "$saver/Contents/Resources"
          sips --resampleHeight 116 dreams/docs/aurora.png --out build/miniatura.png
          sips -c 116 180 build/miniatura.png --out "$saver/Contents/Resources/thumbnail@2x.png"
          sips --resampleHeight 58 dreams/docs/aurora.png --out build/miniatura.png
          sips -c 58 90 build/miniatura.png --out "$saver/Contents/Resources/thumbnail.png"
          sips -g pixelWidth -g pixelHeight "$saver"/Contents/Resources/thumbnail*.png
          # firma "ad hoc": non è un certificato Apple, ma i Mac con Apple Silicon
          # non avviano codice senza nessuna firma. Prima il modulo, poi l'app che lo contiene
          codesign --force --sign - "$saver"
          cp -R "$saver" "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/ASCII Zoo.saver"
          mkdir build/dmg
          cp -R "$app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "ASCII Zoo" -srcfolder build/dmg -ov -format UDZO dist/ascii-zoo-macos.dmg
          cd dist
          shasum -a 256 ascii-zoo-macos.dmg | tee ascii-zoo-macos.dmg.sha256

      - name: Prova - statistiche per nerd
        run: '"build/ASCII Zoo.app/Contents/MacOS/ascii-zoo" --statistiche'

      # il modulo come lo carica macOS: NSBundle, NSPrincipalClass, una vista grande e
      # un'anteprima nello stesso processo; le immagini non devono essere vuote e alla
      # notifica di fine salvaschermo il processo deve uscire da solo
      - name: Prova - lo screensaver si carica e disegna
        run: |
          xcrun swiftc -O -o prova-saver .github/macos-saver-test/saver.swift
          ./prova-saver "build/ASCII Zoo.app/Contents/Resources/ASCII Zoo.saver" prova-screensaver/dentro-app --willstop
          echo "uscito con 0 dopo com.apple.screensaver.willstop"

      # l'installazione che fa la voce "Usa come screensaver…" (senza aprire le impostazioni):
      # un modulo di altri con lo stesso nome non si tocca; il nostro arriva senza la
      # quarantena anche se l'originale ce l'ha, e da lì si carica
      - name: Prova - installazione dello screensaver
        run: |
          app="build/ASCII Zoo.app"
          mod="$HOME/Library/Screen Savers/ASCII Zoo.saver"
          mkdir -p "$mod/Contents"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict>' \
            '<key>CFBundleIdentifier</key><string>com.example.altro</string></dict></plist>' > "$mod/Contents/Info.plist"
          if "$app/Contents/MacOS/ascii-zoo" --installa-salvaschermo; then
            echo "::error::l'installazione ha sostituito un modulo di altri"; exit 1
          fi
          grep -q com.example.altro "$mod/Contents/Info.plist" || { echo "::error::il modulo di altri è cambiato"; exit 1; }
          rm -rf "$mod"
          find "$app/Contents/Resources/ASCII Zoo.saver" -type f -exec xattr -w com.apple.quarantine "0081;00000000;Safari;" {} \;
          "$app/Contents/MacOS/ascii-zoo" --installa-salvaschermo
          ls -lR "$mod"
          if xattr -r "$mod" | grep -q quarantine; then
            echo "::error::il modulo installato ha la quarantena"; exit 1
          fi
          diff -r "$app/Contents/Resources/ASCII Zoo.saver" "$mod"
          codesign --verify --strict --verbose=2 "$mod"
          ./prova-saver "$mod" prova-screensaver/installato
          # per la prova dell'aggiornamento all'avvio (passo dopo): una versione diversa
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          sed -i '' "s#<string>$version</string>#<string>0.0.1</string>#" "$mod/Contents/Info.plist"
          grep -q 0.0.1 "$mod/Contents/Info.plist"

      # "Prova adesso" del menu Screensaver: l'app carica il suo modulo a tutto schermo, con la
      # scena di screensaver.json (quello che scrive il menu); la foto deve essere quasi tutta
      # scura (il fondo delle scene) ma con la scena accesa, e un clic lo chiude
      - name: Prova - "Prova adesso" dello screensaver
        # con un tag non deve fermare il DMG e la Release (foto e clic simulati dipendono dal runner)
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          xcrun swiftc -O -o clic .github/macos-click-test/click.swift || echo "::warning::non si compila il simulatore di clic"
          mkdir -p "$HOME/Library/Application Support/AsciiZoo" prova-screensaver
          echo '{"scena": "fuoco", "orologio": false}' > "$HOME/Library/Application Support/AsciiZoo/screensaver.json"
          ASCII_ZOO_LOG=1 "build/ASCII Zoo.app/Contents/MacOS/ascii-zoo" --salvaschermo 2> sogno-macos.log &
          pid=$!
          sleep 6
          screencapture -x prova-screensaver/prova-adesso.png || echo "::warning::screenshot non riuscito"
          cat sogno-macos.log
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::--salvaschermo si è chiuso da solo"; exit 1
          fi
          grep -q "prova su" sogno-macos.log || { echo "::error::nessuna vista dello screensaver"; kill "$pid"; exit 1; }
          if [ -s prova-screensaver/prova-adesso.png ]; then
            sips -s format bmp prova-screensaver/prova-adesso.png --out prova-adesso.bmp >/dev/null
            python3 - prova-adesso.bmp <<'PY'
          import struct, sys
          b = open(sys.argv[1], 'rb').read()
          inizio, = struct.unpack_from('<I', b, 10)
          w, h, _, bpp = struct.unpack_from('<iiHH', b, 18)
          h = abs(h); passo = (w * bpp // 8 + 3) // 4 * 4; n = bpp // 8
          scuri = accesi = 0
          for y in range(0, h, 2):
              riga = inizio + y * passo
              for x in range(0, w, 2):
                  p = b[riga + x * n: riga + x * n + 3]
                  m = max(p)
                  scuri += m < 24
                  accesi += m > 80
          tot = ((h + 1) // 2) * ((w + 1) // 2)
          print(f"foto {w}x{h}: scuri {100 * scuri / tot:.1f}%, accesi {100 * accesi / tot:.2f}%")
          if scuri < tot * 0.5:
              sys.exit("::error::lo schermo non è quello dello screensaver (poco scuro)")
          if accesi < tot * 0.001:
              sys.exit("::error::lo screensaver è tutto spento")
          PY
          fi
          # un clic chiude la prova (se il runner accetta i clic simulati)
          if [ -x ./clic ]; then
            ./clic 500 400
            for i in 1 2 3 4 5 6; do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
          fi
          if kill -0 "$pid" 2>/dev/null; then
            echo "::warning::il clic simulato non ha chiuso la prova dello screensaver (permesso Accessibilità del runner?)"
            kill "$pid"
          else
            echo "chiuso dal clic"
          fi
          rm "$HOME/Library/Application Support/AsciiZoo/screensaver.json"

      - name: Prova - avvia l'app e fotografa lo schermo
        run: |
          [ -x ./clic ] || xcrun swiftc -O -o clic .github/macos-click-test/click.swift || echo "::warning::non si compila il simulatore di clic"
          ASCII_ZOO_LOG=1 "build/ASCII Zoo.app/Contents/MacOS/ascii-zoo" 2> app-macos.log &
          pid=$!
          sleep 20
          screencapture -x prova-macos.png || echo "::warning::screenshot non riuscito"
          # clic simulati: sul desktop vuoto deve arrivare allo sfondo, sulla barra dei menu no
          if [ -x ./clic ]; then
            ./clic 400 400; sleep 1
            ./clic 900 8; sleep 1
            ./clic 400 400; sleep 1
          fi
          echo "--- log dell'app ---"; cat app-macos.log
          arrivati=$(grep -c "→ schermo" app-macos.log || true)
          if grep -q "clic a 900,.*non sul desktop" app-macos.log && [ "$arrivati" = 2 ]; then
            echo "clic sul desktop: arrivati i 2 sul desktop, scartato quello sulla barra dei menu"
          elif [ "$arrivati" -gt 2 ]; then
            echo "::error::su macOS un clic sulla barra dei menu è arrivato allo sfondo"
            exit 1
          else
            echo "::warning::su macOS i clic simulati non sono arrivati come previsto ($arrivati sul desktop): il runner potrebbe scartare i clic simulati (permesso Accessibilità), vedi il log"
          fi
          # il desktop del runner è vuoto e lo sfondo si vede: se risulta in pausa, lo stato
          # di occlusione di macOS non dice quello che ci si aspetta
          if grep -q "in pausa" app-macos.log; then
            echo "::warning::su macOS lo sfondo è in pausa sul desktop vuoto del runner (log qui sopra)"
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::l'app si è chiusa da sola"
            exit 1
          fi
          kill "$pid"

      # scene tue: con la cartella delle scene l'app scrive un file per ogni animale di serie in
      # scene/di-serie (11 animali e 6 paesaggi), e lucciole.js è la voce 18 del menu Sfondo (dopo
      # "A rotazione", gli 11 animali e i 6 paesaggi): nella foto l'erba con le lucciole. Il
      # config.json è scritto come una versione fino alla 0.8 (9 animali, posizione 16, senza
      # animali_di_serie): l'app lo sposta da sola alla 18, così si prova anche la migrazione
      - name: Prova - scene tue
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          dir="$HOME/Library/Application Support/AsciiZoo"
          mkdir -p "$dir/scene"
          cp scene/lucciole.js "$dir/scene/"
          cp "$dir/config.json" config-prima.json 2>/dev/null || true
          echo '{"animale": 16, "clic_desktop": false, "versione_disponibile": "99.0.0"}' > "$dir/config.json"
          # avviso di aggiornamento (come su Windows): voce nel menu, poi il controllo subito la toglie
          ASCII_ZOO_LOG=1 ASCII_ZOO_AGGIORNAMENTI_SUBITO=1 "build/ASCII Zoo.app/Contents/MacOS/ascii-zoo" 2> scene-macos.log &
          pid=$!
          sleep 15
          screencapture -x prova-screensaver/scene-lucciole.png || echo "::warning::screenshot non riuscito"
          kill "$pid" || true
          sleep 1
          grep "scena" scene-macos.log || true
          ls "$dir/scene/di-serie"
          n=$(ls "$dir/scene/di-serie"/*.js | wc -l | tr -d ' ')
          [ "$n" = 17 ] || { echo "::error::in di-serie ci sono $n file invece di 17"; exit 1; }
          grep -q 'scena lucciole: "Lucciole"' scene-macos.log || { echo "::error::lucciole.js non letta"; exit 1; }
          # a pagina caricata le lucciole ci sono già: lo script iniziale (ZOO_INIZIO) funziona anche
          # in WKWebView, e la posizione 16 della 0.8 è diventata la 18
          grep "avvio:" scene-macos.log || true
          grep -q "mostra lucciole" scene-macos.log || { echo "::error::a pagina caricata non mostra le lucciole (script iniziale o migrazione)"; exit 1; }
          grep "aggiornamenti" scene-macos.log || true
          grep -qF "nel menu la versione 99.0.0 (Ok(()))" scene-macos.log || { echo "::error::la voce dell'aggiornamento non è nel menu"; exit 1; }
          if grep -q "controllo non riuscito" scene-macos.log; then echo "::warning::GitHub non ha risposto (rete o limite delle richieste)"
          else grep -qF "voce tolta dal menu (Ok(()))" scene-macos.log || { echo "::error::il controllo degli aggiornamenti non è finito"; exit 1; }; fi
          head -3 "$dir/scene/di-serie/koi.js"
          rm -rf "$dir/scene"
          if [ -f config-prima.json ]; then mv config-prima.json "$dir/config.json"; else rm -f "$dir/config.json"; fi

      # all'avvio l'app ha rimesso la sua versione dello screensaver al posto di quella vecchia
      - name: Prova - l'app aggiorna lo screensaver installato
        run: |
          diff -r "build/ASCII Zoo.app/Contents/Resources/ASCII Zoo.saver" "$HOME/Library/Screen Savers/ASCII Zoo.saver"
          grep -i "screensaver" app-macos.log || true

      # come la voce del menu: installa e apre le impostazioni del salvaschermo. Solo foto
      # da guardare, non fa fallire il job: la lista del dialogo crea solo le voci visibili
      # e System Events non la vede, quindi ASCII Zoo non si sceglie da qui
      - name: Prova - apre le impostazioni del salvaschermo (foto)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sw_vers
          "build/ASCII Zoo.app/Contents/MacOS/ascii-zoo" --installa-salvaschermo --apri-impostazioni
          sleep 10
          screencapture -x prova-screensaver/impostazioni.png
          # su macOS 26 si apre il dialogo del salvaschermo: "Custom" mostra la lista dei
          # salvaschermo (il punto viene dalla foto qui sopra, 1024×768)
          if [ -x ./clic ]; then
            ./clic 700 415; sleep 8
            screencapture -x prova-screensaver/impostazioni-lista.png
          fi
          osascript -e 'tell application "System Settings" to quit' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ascii-zoo-macos
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: prova-macos
          path: prova-macos.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-macos-screensaver
          path: prova-screensaver/
          if-no-files-found: warn

  # Il programma per Linux già compilato, che va nelle Release e che linux/install.sh
  # scarica. Si compila in un container Ubuntu 22.04: così va anche sulle distribuzioni
  # più nuove (glibc 2.35 o successiva). Il pacchetto ha dentro il programma, l'icona e
  # l'estensione di GNOME per il clic sul desktop.
  linux-binario:
    name: linux-binario (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # se un runner non arriva (es. quello ARM) il job non resta appeso per ore
    timeout-minutes: 45
    container: ubuntu:22.04
    steps:
      # Dai runner x86_64 archive.ubuntu.com a volte non risponde, e anche quando va ogni
      # pacchetto può metterci un secondo (19/11: tre run ferme 45 minuti, poi 268 pacchetti
      # su 423 in 20 minuti). Quindi: il mirror di Azure (ports.ubuntu.com per aarch64 non si
      # tocca), i .deb scaricati 16 alla volta, e tenuti nella cache di GitHub con una
      # chiave fatta dall'elenco dei pacchetti e delle loro versioni.
      - name: Mirror di Ubuntu ed elenco dei pacchetti
        id: deb
        timeout-minutes: 10
        run: |
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list
          printf 'Acquire::http::Timeout "30";\nAcquire::Retries "3";\nAPT::Keep-Downloaded-Packages "true";\n' > /etc/apt/apt.conf.d/99rete
          # l'immagine docker di Ubuntu cancella i .deb dopo ogni installazione
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update -q
          # "Inst nome [versione di adesso] (versione nuova …" → nome=versione nuova
          apt-get install -s -qq --no-install-recommends $PACCHETTI \
            | sed -nE 's/^Inst ([^ ]+) (\[[^]]*\] )?\(([^ ]+) .*/\1=\3/p' | sort > /tmp/pacchetti.txt
          wc -l < /tmp/pacchetti.txt
          echo "chiave=$(sha256sum /tmp/pacchetti.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
        env:
          PACCHETTI: ca-certificates curl git build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: deb-jammy-${{ matrix.arch }}-${{ steps.deb.outputs.chiave }}
          restore-keys: deb-jammy-${{ matrix.arch }}-

      - name: Strumenti e librerie per compilare
        timeout-minutes: 20
        run: |
          cd /var/cache/apt/archives
          ls ./*.deb 2>/dev/null | wc -l | xargs echo "pacchetti già nella cache:"
          # quelli che mancano, 16 alla volta (apt-get download controlla gli hash); se qualcuno
          # non arriva lo riprende apt-get install qui sotto
          while IFS='=' read -r nome versione; do
            ls "${nome}_"*.deb >/dev/null 2>&1 || echo "$nome=$versione"
          done < /tmp/pacchetti.txt > /tmp/mancanti.txt
          wc -l < /tmp/mancanti.txt | xargs echo "da scaricare:"
          xargs -r -P 16 -n 8 apt-get download -qq < /tmp/mancanti.txt 2>&1 | grep -v unsandboxed || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends -o Dpkg::Use-Pty=0 $PACCHETTI
          apt-get autoclean -q
        env:
          PACCHETTI: ca-certificates curl git build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: actions/checkout@v4

      - name: Lo sfondo incorporato è uguale a wallpaper/index.html
        run: cmp wallpaper/index.html app/assets/ascii-zoo-wallpaper.html

      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.arch }}

      - name: Compila
        working-directory: app
        run: cargo build --release --locked

      - name: Pacchetto e SHA256
        run: |
          d=ascii-zoo-linux-${{ matrix.arch }}
          mkdir -p "build/$d" dist
          cp app/target/release/ascii-zoo linux/ascii-zoo.svg "build/$d/"
          cp -r linux/gnome "build/$d/gnome"
          "build/$d/ascii-zoo" --version
          "build/$d/ascii-zoo" --statistiche
          tar -C build -czf "dist/$d.tar.gz" "$d"
          cd dist
          sha256sum "$d.tar.gz" | tee "$d.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ascii-zoo-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # Il percorso normale di linux/install.sh, come lo vede chi lo usa: su un Ubuntu 24.04
  # senza librerie di sviluppo scarica il pacchetto di questa run come se fosse quello della
  # Release, ne controlla lo SHA256, installa solo le librerie per farlo partire (non
  # compila niente) e il programma parte.
  linux-installa-binario:
    needs: linux-binario
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ascii-zoo-linux-x86_64
          path: dist

      - name: Installa con linux/install.sh il programma già compilato
        env:
          ASCII_ZOO_NON_AVVIARE: "1"
        run: |
          set -o pipefail
          ASCII_ZOO_RELEASE_URL="file://$PWD/dist" bash linux/install.sh 2>&1 | tee install.log
          grep -q "SHA256 verificato" install.log
          if grep -q "Compilo ASCII Zoo" install.log; then
            echo "::error::install.sh ha compilato invece di usare il programma già compilato"
            exit 1
          fi
          ~/.local/bin/ascii-zoo --version

      - name: Prova - avvia l'app sotto Xvfb e fotografa lo schermo
        run: |
          sudo apt-get install -y -qq xvfb openbox imagemagick dbus-x11
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          openbox &
          cat > prova.sh <<'FINE'
          ASCII_ZOO_LOG=1 ~/.local/bin/ascii-zoo > app.log 2>&1 &
          pid=$!
          sleep 20
          import -window root prova-linux-binario.png || echo "::warning::screenshot non riuscito"
          # il clic sul desktop come lo manda l'estensione di GNOME (punto e dimensioni dello
          # schermo intero di GNOME): deve arrivare allo sfondo, alla pagina
          gdbus call --session --dest io.github.tressilloide.AsciiZoo --object-path /io/github/tressilloide/AsciiZoo \
            --method io.github.tressilloide.AsciiZoo.Clic 960.0 540.0 1920.0 1080.0
          sleep 1
          echo "--- log dell'app ---"; cat app.log
          if ! grep -q "clic sul desktop: 960,540" app.log; then
            echo "::error::il clic mandato via D-Bus non è arrivato allo sfondo"
            exit 1
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::l'app si è chiusa da sola"
            exit 1
          fi
          kill "$pid"
          FINE
          dbus-run-session -- bash prova.sh

      - name: Prova - disinstallazione
        run: |
          bash linux/install.sh --disinstalla
          test ! -e ~/.local/bin/ascii-zoo

      - uses: actions/upload-artifact@v4
        with:
          name: prova-linux-binario
          path: prova-linux-binario.png
          if-no-files-found: warn

  # L'estensione di GNOME per il clic sul desktop (linux/gnome), provata in un GNOME Shell
  # senza schermo con le icone di DING, come su Ubuntu: clic simulati sul desktop, su una
  # finestra, sulla barra in alto e per chiudere un menu; ad ASCII Zoo (qui un finto, sullo
  # stesso nome D-Bus) devono arrivare solo quelli sul desktop.
  # Nello stesso GNOME Shell anche lo screensaver di Linux, con il programma vero di
  # linux-binario: parte dopo un minuto senza input, sta sopra a tutto e si chiude al
  # primo input. E lo sfondo sotto Wayland senza XWayland: l'estensione prende la finestra del
  # programma vero e la mette al posto dello sfondo di GNOME (pause, cascata di estensioni,
  # ritorno su X11 quando la si spegne). Se il programma per ARM non si compila queste prove
  # si fanno lo stesso.
  linux-gnome-clic:
    needs: linux-binario
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Il mirror di Ubuntu a volte va pianissimo (una volta 13 minuti solo per gli sfondi
      # di Ubuntu, che GNOME Shell si porta dietro): i .deb scaricati restano nella cache di
      # GitHub, con una chiave fatta dall'elenco dei pacchetti e delle loro versioni. Se non
      # è cambiato niente non si scarica niente; se no solo i pacchetti cambiati.
      - name: Elenco dei pacchetti di GNOME Shell
        id: deb
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate >/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          # come nel container per compilare: il mirror di Azure, perché archive e security
          # di Ubuntu a volte non rispondono o danno "503 Service Unavailable"
          sudo sed -i -E 's#https?://([a-z0-9.-]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -q -o Acquire::Retries=3
          apt-get install -s -qq --no-install-recommends $PACCHETTI | grep '^Inst ' | sort > pacchetti.txt
          wc -l < pacchetti.txt
          echo "chiave=$(sha256sum pacchetti.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
        env:
          PACCHETTI: >-
            gnome-shell gnome-shell-extension-desktop-icons-ng xwayland zenity python3-gi gir1.2-gtk-3.0 dbus-x11
            libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 imagemagick

      - uses: actions/cache@v4
        with:
          path: ~/deb
          key: gnome-deb-${{ steps.deb.outputs.chiave }}
          restore-keys: gnome-deb-

      # Senza -qq, così se si blocca si vede dove; man-db spento perché il suo trigger
      # sui runner può durare minuti
      - name: GNOME Shell e le icone del desktop (DING)
        timeout-minutes: 25
        run: |
          mkdir -p ~/deb/partial
          ls ~/deb/*.deb 2>/dev/null | wc -l | xargs echo "pacchetti già nella cache:"
          installa() {
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              -o Dir::Cache::Archives="$HOME/deb" -o APT::Keep-Downloaded-Packages=true -o APT::Sandbox::User=root \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
              $PACCHETTI </dev/null
          }
          # un secondo tentativo dopo una pausa: i .deb già arrivati restano nella cartella
          installa || { echo "::warning::apt non ha scaricato tutto, riprovo tra 30 secondi"; sleep 30; installa; }
          # nella cache solo le versioni che servono adesso, non quelle vecchie
          sudo apt-get autoclean -q -o Dir::Cache::Archives="$HOME/deb"
          sudo chown -R "$USER" ~/deb
          gnome-shell --version
        env:
          PACCHETTI: >-
            gnome-shell gnome-shell-extension-desktop-icons-ng xwayland zenity python3-gi gir1.2-gtk-3.0 dbus-x11
            libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 imagemagick

      - name: Prova - clic simulati
        run: bash .github/gnome-click-test/run.sh

      - uses: actions/download-artifact@v4
        with:
          name: ascii-zoo-linux-x86_64
          path: dist

      - name: Prova - screensaver (dopo un minuto senza input, poi un tasto)
        run: |
          tar -C dist -xzf dist/ascii-zoo-linux-x86_64.tar.gz
          bash .github/gnome-screensaver-test/run.sh dist/ascii-zoo-linux-x86_64/ascii-zoo .

      - name: Prova - sfondo sotto Wayland con l'estensione di GNOME (niente XWayland)
        if: ${{ !cancelled() }}
        run: |
          [ -x dist/ascii-zoo-linux-x86_64/ascii-zoo ] || tar -C dist -xzf dist/ascii-zoo-linux-x86_64.tar.gz
          bash .github/gnome-sfondo-test/run.sh dist/ascii-zoo-linux-x86_64/ascii-zoo .

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: prova-screensaver-gnome
          path: |
            prova-screensaver-*
            prova-sfondo-*
            desktop-*.png
          if-no-files-found: warn

  # La riserva di linux/install.sh: se la Release non ha il programma per Linux (qui un
  # indirizzo dove non c'è niente) compila dal sorgente, cioè questo commit. Lo si esegue
  # per intero (pacchetti, compilazione, file nella cartella dell'utente) e poi si avvia il
  # programma su uno schermo virtuale, come prova.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lo sfondo incorporato è uguale a wallpaper/index.html
        run: cmp wallpaper/index.html app/assets/ascii-zoo-wallpaper.html

      - name: Estensione di GNOME (sfondo e clic sul desktop) - sintassi
        run: |
          for d in linux/gnome/*/ .github/gnome-*-test/*@test/; do
            for f in "$d"*.js; do node --input-type=module --check < "$f"; done
            python3 -m json.tool "$d/metadata.json" > /dev/null
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Installa con linux/install.sh, compilando (Release senza programma per Linux)
        env:
          ASCII_ZOO_NON_AVVIARE: "1"
          ASCII_ZOO_RELEASE_URL: file:///nessuna-release
        run: |
          set -o pipefail
          bash linux/install.sh 2>&1 | tee install.log
          grep -q "Compilo ASCII Zoo" install.log

      - name: File installati
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          test -x ~/.local/bin/ascii-zoo
          test -f ~/.local/share/icons/hicolor/scalable/apps/ascii-zoo.svg
          desktop-file-validate ~/.local/share/applications/ascii-zoo.desktop
          desktop-file-validate ~/.config/autostart/ascii-zoo.desktop
          cat ~/.config/autostart/ascii-zoo.desktop

      - name: Prova - avvia l'app sotto Xvfb, con una finestra sopra, e fotografa lo schermo
        run: |
          sudo apt-get install -y -qq xvfb openbox xterm imagemagick dbus-x11 libglib2.0-bin
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          openbox &
          sleep 1
          cat > prova.sh <<'FINE'
          ASCII_ZOO_LOG=1 ~/.local/bin/ascii-zoo > app.log 2>&1 &
          pid=$!
          sleep 20
          # una finestra normale: deve restare sopra lo sfondo
          xterm -geometry 70x12+80+80 -e "echo finestra normale sopra lo sfondo; sleep 60" &
          sleep 4
          import -window root prova-linux.png || echo "::warning::screenshot non riuscito"
          # l'icona nella barra: il programma deve esporre uno StatusNotifierItem su D-Bus
          trovata=no
          nomi=$(gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus \
                   --method org.freedesktop.DBus.ListNames | grep -oE ':[0-9]+\.[0-9]+')
          for n in $nomi; do
            if gdbus introspect --session --dest "$n" --object-path / --recurse 2>/dev/null | grep -q org.kde.StatusNotifierItem; then
              trovata=si
            fi
          done
          echo "icona nella barra registrata su D-Bus: $trovata"
          [ "$trovata" = si ] || echo "::warning::nessuno StatusNotifierItem trovato"
          echo "--- log dell'app ---"; cat app.log
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::l'app si è chiusa da sola"
            exit 1
          fi
          kill "$pid"
          FINE
          dbus-run-session -- bash prova.sh

      # il comando da una riga del README, così com'è (scarica lo script di questo commit,
      # che clona main): solo sui push a main, quando main è proprio questo commit.
      # CARGO_TARGET_DIR riusa la compilazione del passo di prima.
      - name: Prova - il comando da una riga (curl | bash)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASCII_ZOO_NON_AVVIARE: "1"
          CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
        run: |
          rm -f ~/.local/bin/ascii-zoo
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/linux/install.sh" | bash
          # dall'ultima Release se ha il programma per Linux, se no compilato da main
          ~/.local/bin/ascii-zoo --version

      - name: Prova - disinstallazione
        run: |
          bash linux/install.sh --disinstalla
          for f in ~/.local/bin/ascii-zoo ~/.local/share/applications/ascii-zoo.desktop \
                   ~/.local/share/icons/hicolor/scalable/apps/ascii-zoo.svg ~/.config/autostart/ascii-zoo.desktop; do
            if [ -e "$f" ]; then echo "::error::$f è ancora lì"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prova-linux
          path: prova-linux.png
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, linux-binario, linux-installa-binario]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creare la Release
      id-token: write      # attestazione di provenienza
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Il tag corrisponde alla versione in Cargo.toml
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, ma app/Cargo.toml dice $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ascii-zoo-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ascii-zoo-macos
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: ascii-zoo-linux-*
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ascii-zoo.exe
            dist/ascii-zoo-macos.dmg
            dist/ascii-zoo-linux-x86_64.tar.gz
            dist/ascii-zoo-linux-aarch64.tar.gz

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha_exe=$(cut -d' ' -f1 dist/ascii-zoo.exe.sha256)
          sha_dmg=$(cut -d' ' -f1 dist/ascii-zoo-macos.dmg.sha256)
          sha_x86=$(cut -d' ' -f1 dist/ascii-zoo-linux-x86_64.tar.gz.sha256)
          sha_arm=$(cut -d' ' -f1 dist/ascii-zoo-linux-aarch64.tar.gz.sha256)
          cat > notes.md <<EOF
          ## Scarica

          | Sistema | File | SHA256 |
          |---|---|---|
          | Windows 10/11 (64 bit) | \`ascii-zoo.exe\` | \`$sha_exe\` |
          | macOS 11 o successivo (Apple Silicon e Intel) | \`ascii-zoo-macos.dmg\` | \`$sha_dmg\` |
          | Linux x86_64 (lo scarica install.sh) | \`ascii-zoo-linux-x86_64.tar.gz\` | \`$sha_x86\` |
          | Linux aarch64 (lo scarica install.sh) | \`ascii-zoo-linux-aarch64.tar.gz\` | \`$sha_arm\` |

          Compilati da GitHub Actions dal sorgente di questo tag: [log della build](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          ### Windows
          Non si installa: copia \`ascii-zoo.exe\` in una cartella fissa (es. \`%LOCALAPPDATA%\\AsciiZoo\`) e avvialo.
          L'exe non è firmato, quindi al primo avvio SmartScreen lo blocca: **Ulteriori informazioni → Esegui comunque**.

          ### macOS
          Apri il DMG e trascina **ASCII Zoo** in **Applicazioni**. L'app non è firmata con un certificato Apple, quindi al primo avvio macOS la blocca:
          apri **Impostazioni di Sistema → Privacy e sicurezza** e premi **Apri comunque** (poi conferma). L'icona compare nella barra dei menu.

          ### Linux
          Un solo comando nel terminale: scarica il programma già compilato di questa versione, ne controlla lo SHA256 e lo installa nella cartella utente, con le librerie che mancano (apt, dnf o pacman). Su un processore diverso da x86_64 e aarch64 lo compila dal sorgente. L'icona compare nella barra in alto; su GNOME il clic sul desktop funziona dal prossimo accesso.

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/linux/install.sh | bash
          \`\`\`

          ## Verificarli

          \`\`\`
          gh attestation verify <file> --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          # le novità della versione, se ci sono (.github/novita/<tag>.md), vanno in cima
          if [ -f ".github/novita/$GITHUB_REF_NAME.md" ]; then
            cat ".github/novita/$GITHUB_REF_NAME.md" notes.md > notes-tutte.md && mv notes-tutte.md notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/ascii-zoo.exe dist/ascii-zoo.exe.sha256 \
            dist/ascii-zoo-macos.dmg dist/ascii-zoo-macos.dmg.sha256 \
            dist/ascii-zoo-linux-x86_64.tar.gz dist/ascii-zoo-linux-x86_64.tar.gz.sha256 \
            dist/ascii-zoo-linux-aarch64.tar.gz dist/ascii-zoo-linux-aarch64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "ASCII Zoo $GITHUB_REF_NAME" --notes-file notes.md
